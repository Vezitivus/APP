<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Live Building AR</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f5f5f7;color:#111}
    body{min-height:100svh}
    .app{min-height:100svh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 22px);background:radial-gradient(circle at 50% 0,#fff 0,#f5f5f7 48%,#e9e9ed 100%)}
    header{display:flex;justify-content:space-between;align-items:center}
    .brand{font-size:28px;font-weight:800;letter-spacing:-.04em}
    .badge{font-size:12px;font-weight:750;padding:8px 11px;border:1px solid rgba(0,0,0,.08);border-radius:999px;background:rgba(255,255,255,.75)}
    .hero{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 12px}
    .house{width:min(76vw,340px);aspect-ratio:1.55;border-radius:28px;background:linear-gradient(145deg,#fff,#e9eaee);box-shadow:0 30px 70px rgba(0,0,0,.10);position:relative;border:1px solid rgba(255,255,255,.9)}
    .house:before{content:"";position:absolute;left:17%;right:17%;bottom:22%;height:40%;border-radius:8px;background:#d8dbe1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
    .house:after{content:"20 m";position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:13px;font-weight:800;color:#686a70}
    .panel{padding:17px;border-radius:28px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 50px rgba(0,0,0,.11);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .title{font-size:20px;font-weight:800;letter-spacing:-.03em}
    .sub{font-size:13px;color:#6e6e73;margin-top:3px}
    .dims{font-size:14px;font-weight:800;background:#f0f0f3;border-radius:14px;padding:10px 12px;white-space:nowrap}
    .ar-link{display:flex;align-items:center;justify-content:center;width:100%;height:62px;border-radius:20px;background:#111;color:#fff;text-decoration:none;font-size:17px;font-weight:800;letter-spacing:-.02em;box-shadow:0 10px 24px rgba(0,0,0,.18)}
    .ar-link:active{transform:scale(.985)}
    .note{font-size:12px;color:#77777f;text-align:center;line-height:1.4;margin:12px 8px 2px}
    .status{display:inline-block;margin-top:12px;padding:8px 11px;border-radius:999px;background:#ebf7ed;color:#267337;font-size:11px;font-weight:800}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">Live Building</div>
      <div class="badge">iPhone AR</div>
    </header>

    <section class="hero">
      <div>
        <div class="house"></div>
        <div class="status">Native Apple Quick Look</div>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <div>
          <div class="title">20 m testa ēka</div>
          <div class="sub">Īsts USDZ fails • ARKit Quick Look</div>
        </div>
        <div class="dims">20 × 12 × 7 m</div>
      </div>

      <a class="ar-link" rel="ar" href="./livebuilding.usdz">ATVĒRT KAMERĀ</a>
      <div class="note">Nospied pogu. iPhone jāatver Apple AR skats. Kustini telefonu, līdz tas atrod zemi, tad novieto ēku.</div>
    </section>
  </main>
</body>
</html>
