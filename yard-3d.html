<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101317"><title>YARD GPS 3D</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"><style>
html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101317}*{box-sizing:border-box}button,input{font:inherit}.top{position:absolute;z-index:10;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.pill,.btn{pointer-events:auto;background:rgba(16,19,23,.94);color:#fff;border:1px solid #ffffff22;border-radius:15px;padding:10px 12px;font-weight:800;box-shadow:0 8px 24px #0005}.brand{letter-spacing:.14em}.tools{position:absolute;z-index:10;right:10px;top:calc(env(safe-area-inset-top) + 64px);display:grid;gap:8px}.tool{width:48px;height:48px;border:0;border-radius:15px;background:rgba(16,19,23,.95);color:#fff;font-size:20px;font-weight:800;box-shadow:0 8px 22px #0005}.tool.active{outline:3px solid #00d6a6}.panel{display:none;position:absolute;z-index:20;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:rgba(16,19,23,.97);color:#fff;border:1px solid #ffffff22;border-radius:22px;padding:15px;box-shadow:0 14px 36px #0009}.panel.show{display:block}.panel h3{margin:0 0 12px}.row{display:flex;gap:10px}.field{flex:1;margin-bottom:10px}.field label{display:block;color:#aab3bf;font-size:12px;margin-bottom:5px}.field input{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff22;background:#252b33;color:#fff;font-size:16px}.save,.delete{width:100%;padding:13px;border:0;border-radius:14px;color:#fff;font-weight:850;font-size:16px}.save{background:linear-gradient(135deg,#ff3b30,#ff7a00)}.delete{margin-top:8px;background:#7b1f27}.hint{position:absolute;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(16,19,23,.82);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;white-space:nowrap}.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none}
</style></head><body><div id="map"></div><div class="top"><div class="pill brand">YARD 3D</div><button id="back" class="btn">2D</button></div><div class="tools"><button id="edit" class="tool" title="Atlasīt un rediģēt">✎</button><button id="home" class="tool" title="Skats uz objektiem">◎</button><button id="globe" class="tool" title="Globuss">🌐</button></div><div id="hint" class="hint">✎ → pieskaries jebkuram objektam · divi pirksti = slīpums/rotācija</div><div id="panel" class="panel"><h3 id="nameTitle">Objekts</h3><div class="field"><label>Nosaukums</label><input id="name"></div><div class="row"><div id="heightWrap" class="field"><label>Augstums, m</label><input id="height" type="number" min="0" step="0.1"></div><div class="field"><label>Krāsa</label><input id="color" type="color"></div></div><button id="save" class="save">Saglabāt</button><button id="delete" class="delete">Dzēst objektu</button></div><script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script>
(()=>{'use strict';
const STORE='yard_shapes_v13';let editing=false,activeId=null,globe=false;
const getAll=()=>{try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(a)?a:[]}catch(_){return[]}},putAll=a=>localStorage.setItem(STORE,JSON.stringify(a));
function normalized(){return getAll().map(s=>({...s,id:Number(s.id),type:s.type==='line'?'line':'area',height:Math.max(0,+s.height||0),color:s.color||'#ff4b2b',points:Array.isArray(s.points)?s.points:[]}))}
function polys(){return{type:'FeatureCollection',features:normalized().filter(s=>s.type==='area'&&s.points.length>=3).map(s=>({type:'Feature',id:s.id,properties:{id:s.id,name:s.name||'Laukums',height:s.height,color:s.color},geometry:{type:'Polygon',coordinates:[[...s.points.map(p=>[+p.lng,+p.lat]),[+s.points[0].lng,+s.points[0].lat]]]}}))}}
function lines(){return{type:'FeatureCollection',features:normalized().filter(s=>s.type==='line'&&s.points.length>=2).map(s=>({type:'Feature',id:s.id,properties:{id:s.id,name:s.name||'Līnija',color:s.color},geometry:{type:'LineString',coordinates:s.points.map(p=>[+p.lng,+p.lat])}}))}}
const map=new maplibregl.Map({container:'map',center:[24.1052,56.9496],zoom:17,pitch:62,bearing:-22,maxPitch:85,antialias:true,style:{version:8,sources:{base:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap'},terrain:{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json'},areas:{type:'geojson',data:polys()},lines:{type:'geojson',data:lines()}},layers:[{id:'base',type:'raster',source:'base'},{id:'area-flat',type:'fill',source:'areas',paint:{'fill-color':['get','color'],'fill-opacity':0.25}},{id:'area-outline',type:'line',source:'areas',paint:{'line-color':['get','color'],'line-width':3}},{id:'area-3d',type:'fill-extrusion',source:'areas',paint:{'fill-extrusion-color':['get','color'],'fill-extrusion-height':['get','height'],'fill-extrusion-base':0,'fill-extrusion-opacity':0.88}},{id:'line-visible',type:'line',source:'lines',paint:{'line-color':['get','color'],'line-width':5}},{id:'line-hit',type:'line',source:'lines',paint:{'line-color':'#000000','line-width':28,'line-opacity':0.01}}],terrain:{source:'terrain',exaggeration:1}}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true,showZoom:true}),'bottom-right');
function refresh(){map.getSource('areas')?.setData(polys());map.getSource('lines')?.setData(lines())}
function fit(){const a=normalized().filter(s=>s.points.length);if(!a.length)return;const b=new maplibregl.LngLatBounds();a.forEach(s=>s.points.forEach(p=>b.extend([+p.lng,+p.lat])));map.fitBounds(b,{padding:70,pitch:62,bearing:-22,duration:500})}
function openEditor(id){const s=normalized().find(x=>x.id===id);if(!s)return;activeId=id;document.getElementById('nameTitle').textContent=s.name||'Objekts';document.getElementById('name').value=s.name||'';document.getElementById('height').value=s.type==='area'?s.height:0;document.getElementById('heightWrap').style.display=s.type==='area'?'block':'none';document.getElementById('color').value=s.color;document.getElementById('panel').classList.add('show')}
function selectAt(point,lngLat){const fs=map.queryRenderedFeatures(point,{layers:['area-3d','area-flat','area-outline','line-hit','line-visible']});if(!fs.length){activeId=null;document.getElementById('panel').classList.remove('show');return}const f=fs[0],id=Number(f.properties.id);if(!Number.isFinite(id))return;if(editing)openEditor(id);else{const s=normalized().find(x=>x.id===id);if(s)new maplibregl.Popup().setLngLat(lngLat).setHTML(`<b>${String(s.name||'Objekts').replace(/[<>]/g,'')}</b><br>${s.type==='area'?'Augstums: '+s.height.toFixed(1)+' m':'Līnija'}<br><small>Ieslēdz ✎, lai rediģētu</small>`).addTo(map)}}
map.on('load',()=>{fit();refresh()});map.on('click',e=>selectAt(e.point,e.lngLat));map.on('mousemove',e=>{const fs=map.queryRenderedFeatures(e.point,{layers:['area-3d','area-flat','area-outline','line-hit','line-visible']});map.getCanvas().style.cursor=fs.length?'pointer':''});
document.getElementById('edit').onclick=()=>{editing=!editing;activeId=null;document.getElementById('edit').classList.toggle('active',editing);document.getElementById('panel').classList.remove('show');document.getElementById('hint').textContent=editing?'✎ Pieskaries jebkuram laukumam vai līnijai':'Velc ar pirkstu · divi pirksti = slīpums/rotācija'};
document.getElementById('save').onclick=()=>{if(activeId==null)return;const a=getAll(),s=a.find(x=>Number(x.id)===activeId);if(!s)return;s.name=document.getElementById('name').value.trim()||s.name||'Objekts';s.color=document.getElementById('color').value;if(s.type!=='line')s.height=Math.max(0,+document.getElementById('height').value||0);putAll(a);refresh();document.getElementById('panel').classList.remove('show')};
document.getElementById('delete').onclick=()=>{if(activeId==null)return;if(!confirm('Dzēst šo objektu?'))return;putAll(getAll().filter(x=>Number(x.id)!==activeId));activeId=null;refresh();document.getElementById('panel').classList.remove('show')};
document.getElementById('home').onclick=fit;document.getElementById('back').onclick=()=>location.href='yard-measure.html?v=15';document.getElementById('globe').onclick=()=>{globe=!globe;map.setProjection({type:globe?'globe':'mercator'});document.getElementById('globe').classList.toggle('active',globe)};window.addEventListener('storage',refresh)
})();
</script></body></html>
