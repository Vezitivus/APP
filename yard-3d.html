<!doctype html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101317"><title>YARD GPS 3D</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"><style>
html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101317}*{box-sizing:border-box}.top{position:absolute;z-index:10;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.pill,.btn{pointer-events:auto;background:rgba(16,19,23,.94);color:#fff;border:1px solid #ffffff22;border-radius:15px;padding:10px 12px;font-weight:800;box-shadow:0 8px 24px #0005}.brand{letter-spacing:.14em}.tools{position:absolute;z-index:10;right:10px;top:calc(env(safe-area-inset-top) + 64px);display:grid;gap:8px}.tool{width:48px;height:48px;border:0;border-radius:15px;background:rgba(16,19,23,.95);color:#fff;font-size:20px;box-shadow:0 8px 22px #0005}.tool.active{outline:2px solid #fff8}.panel{display:none;position:absolute;z-index:20;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:rgba(16,19,23,.97);color:#fff;border:1px solid #ffffff22;border-radius:22px;padding:15px;box-shadow:0 14px 36px #0009}.panel.show{display:block}.panel h3{margin:0 0 12px}.row{display:flex;gap:10px}.field{flex:1}.field label{display:block;color:#aab3bf;font-size:12px;margin-bottom:5px}.field input{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff22;background:#252b33;color:#fff;font-size:16px}.save{margin-top:12px;width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff3b30,#ff7a00);color:#fff;font-weight:850;font-size:16px}.hint{position:absolute;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(16,19,23,.82);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;white-space:nowrap}.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none}
</style></head><body><div id="map"></div><div class="top"><div class="pill brand">YARD 3D</div><button id="back" class="btn">2D</button></div><div class="tools"><button id="edit" class="tool" title="Rediģēt">✎</button><button id="home" class="tool" title="Skats uz objektiem">◎</button><button id="globe" class="tool" title="Globuss">🌐</button></div><div id="hint" class="hint">Velc ar pirkstu · divi pirksti = slīpums un rotācija</div><div id="panel" class="panel"><h3 id="name">Objekts</h3><div class="row"><div class="field"><label>Augstums, m</label><input id="height" type="number" min="0" step="0.1"></div><div class="field"><label>Krāsa</label><input id="color" type="color"></div></div><button id="save" class="save">Saglabāt</button></div><script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script><script>
(()=>{'use strict';const STORE='yard_shapes_v13';let editing=false,activeId=null,globe=false;const getAll=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return[]}},putAll=a=>localStorage.setItem(STORE,JSON.stringify(a));function featureCollection(){return{type:'FeatureCollection',features:getAll().filter(s=>s.type!=='line'&&s.points?.length>=3).map(s=>({type:'Feature',id:s.id,properties:{id:s.id,name:s.name||'Laukums',height:+s.height||0,color:s.color||'#ff4b2b'},geometry:{type:'Polygon',coordinates:[[...s.points.map(p=>[p.lng,p.lat]),[s.points[0].lng,s.points[0].lat]]]}}))}}const map=new maplibregl.Map({container:'map',center:[24.1052,56.9496],zoom:17,pitch:62,bearing:-22,maxPitch:85,antialias:true,style:{version:8,sources:{base:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap'},terrain:{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json'},shapes:{type:'geojson',data:featureCollection()}},layers:[{id:'base',type:'raster',source:'base'},{id:'shape-flat',type:'fill',source:'shapes',paint:{'fill-color':['get','color'],'fill-opacity':0.22}},{id:'shape-outline',type:'line',source:'shapes',paint:{'line-color':['get','color'],'line-width':2}},{id:'shape-3d',type:'fill-extrusion',source:'shapes',paint:{'fill-extrusion-color':['get','color'],'fill-extrusion-height':['get','height'],'fill-extrusion-base':0,'fill-extrusion-opacity':0.86}}],terrain:{source:'terrain',exaggeration:1},sky:{}}});map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true,showZoom:true}),'bottom-right');function refresh(){const s=map.getSource('shapes');if(s)s.setData(featureCollection())}function fit(){const a=getAll().filter(s=>s.type!=='line'&&s.points?.length);if(!a.length)return;const b=new maplibregl.LngLatBounds();a.forEach(s=>s.points.forEach(p=>b.extend([p.lng,p.lat])));map.fitBounds(b,{padding:70,pitch:62,bearing:-22,duration:700})}map.on('load',fit);map.on('click','shape-3d',e=>{const f=e.features?.[0];if(!f)return;activeId=Number(f.properties.id);if(editing){const s=getAll().find(x=>x.id===activeId);if(!s)return;document.getElementById('name').textContent=s.name||'Objekts';document.getElementById('height').value=+s.height||0;document.getElementById('color').value=s.color||'#ff4b2b';document.getElementById('panel').classList.add('show')}else new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${f.properties.name}</b><br>Augstums: ${Number(f.properties.height).toFixed(1)} m`).addTo(map)});map.on('mouseenter','shape-3d',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','shape-3d',()=>map.getCanvas().style.cursor='');document.getElementById('edit').onclick=()=>{editing=!editing;document.getElementById('edit').classList.toggle('active',editing);if(!editing){activeId=null;document.getElementById('panel').classList.remove('show')}};document.getElementById('save').onclick=()=>{if(activeId==null)return;const a=getAll(),s=a.find(x=>x.id===activeId);if(!s)return;s.height=Math.max(0,+document.getElementById('height').value||0);s.color=document.getElementById('color').value;putAll(a);refresh();document.getElementById('panel').classList.remove('show')};document.getElementById('home').onclick=fit;document.getElementById('back').onclick=()=>location.href='yard-measure.html?v=14';document.getElementById('globe').onclick=()=>{globe=!globe;map.setProjection({type:globe?'globe':'mercator'});document.getElementById('globe').classList.toggle('active',globe)};window.addEventListener('storage',refresh)})();
</script></body></html>
