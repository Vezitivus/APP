<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101317">
<title>YARD GPS</title>
<style>
:root{--bg:#101317;--panel:#171b20;--panel2:#20262e;--text:#f7f8fa;--muted:#97a1af;--line:#ff4b2b;--live:#ff9f1c;--gps:#2f80ff;--good:#2bd576;--warn:#ffb020;--bad:#ff4b55;--grid:#d8dde5;--paper:#f8f9fb;--ink:#12161c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{border:0;cursor:pointer}.app{position:relative;width:100%;height:100%;overflow:hidden}.paper{position:absolute;inset:0;background:var(--paper)}#sheet{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.pill{pointer-events:auto;background:rgba(16,19,23,.94);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(14px);border-radius:16px;padding:10px 13px;font-size:13px;font-weight:800;box-shadow:0 8px 25px rgba(0,0,0,.20)}.brand{letter-spacing:.14em}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:7px}.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.tools{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 67px);right:12px;display:grid;gap:8px}.tool{width:46px;height:46px;border-radius:15px;background:rgba(16,19,23,.94);color:#fff;font-size:22px;box-shadow:0 7px 20px rgba(0,0,0,.18)}.tool:active{transform:scale(.97)}.scale-pill{position:absolute;z-index:4;left:14px;top:calc(env(safe-area-inset-top) + 70px);background:rgba(255,255,255,.92);color:#1c222b;border:1px solid #d8dde5;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:800}.bottom{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:rgba(16,19,23,.96);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(16px);border-radius:24px;padding:14px;box-shadow:0 15px 40px rgba(0,0,0,.28)}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:11px}.status b{display:block;font-size:16px}.status small{display:block;color:var(--muted);margin-top:3px;max-width:240px}.live{text-align:right;min-width:105px}.live strong{display:block;font-size:22px}.live small{color:var(--muted)}.row{display:flex;gap:8px}.primary,.secondary,.danger{border-radius:15px;padding:13px 12px;font-weight:850;font-size:15px}.primary{flex:1;background:linear-gradient(135deg,#ff3b30,#ff7a00);color:#fff}.secondary{background:var(--panel2);color:#fff}.danger{background:#412329;color:#ffd7da}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.actions button:disabled,.row button:disabled{opacity:.32;cursor:default}.hint{font-size:11px;color:#8e98a6;margin-top:9px;text-align:center}.modal{display:none;position:absolute;z-index:20;inset:0;background:rgba(0,0,0,.58);align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(420px,100%);background:#11161c;border:1px solid #ffffff20;border-radius:22px;padding:18px}.box h2{margin:0 0 6px}.metrics{display:flex;gap:10px;margin:14px 0}.metric{flex:1;background:#20262e;border-radius:14px;padding:12px}.metric small{display:block;color:#9aa4b2}.metric b{display:block;font-size:20px;margin-top:4px}.box input{width:100%;border:1px solid #ffffff2b;background:#20262e;color:#fff;border-radius:13px;padding:13px;margin-bottom:12px;font-size:16px}.toast{position:absolute;z-index:30;top:110px;left:50%;transform:translate(-50%,-12px);opacity:0;background:#11161c;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:750;transition:.18s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.seg-label{font-size:13px;font-weight:850;fill:#11161c;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.pt-label{font-size:11px;font-weight:800;fill:#4f5966}.area-label{font-size:15px;font-weight:900;fill:#11161c;paint-order:stroke;stroke:#fff;stroke-width:6px}.grid-line{stroke:var(--grid);stroke-width:1}.axis-line{stroke:#c1c8d1;stroke-width:1.4}.fixed-line{stroke:var(--line);stroke-width:4;stroke-linecap:round}.live-line{stroke:var(--live);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:9 8}.shape-fill{fill:rgba(255,75,43,.10);stroke:none}.point{fill:#fff;stroke:var(--line);stroke-width:4}.start{fill:var(--line);stroke:#fff;stroke-width:4}.gps-ring{fill:rgba(47,128,255,.09);stroke:rgba(47,128,255,.45);stroke-width:1.5}.gps-dot{fill:var(--gps);stroke:#fff;stroke-width:4}
</style>
</head>
<body>
<div class="app">
  <div class="paper"><svg id="sheet" aria-label="GPS uzmērījuma zīmēšanas laukums"></svg></div>
  <div class="top"><div class="pill brand">YARD GPS</div><div class="pill"><span id="dot" class="dot"></span><span id="gpsText">GPS gaida…</span></div></div>
  <div id="scale" class="scale-pill">1 rūtiņa = 1 m</div>
  <div class="tools"><button id="zoomIn" class="tool" title="Pietuvināt">+</button><button id="zoomOut" class="tool" title="Attālināt">−</button><button id="fit" class="tool" title="Ietilpināt">⌾</button></div>
  <div class="bottom">
    <div class="head"><div class="status"><b id="title">GPS inicializācija</b><small id="sub">Atļauj atrašanās vietas piekļuvi</small></div><div class="live"><strong id="live">0.00 m</strong><small id="livecm">0 m 0 cm</small></div></div>
    <div class="row"><button id="main" class="primary" disabled>Uzlikt sākuma punktu</button><button id="undo" class="secondary" disabled>↶</button></div>
    <div class="actions"><button id="finish" class="secondary" disabled>Beigt līniju</button><button id="close" class="secondary" disabled>Noslēgt figūru</button><button id="reset" class="danger">Dzēst</button></div>
    <div class="hint">Nav kartes — zīmējums veidojas tikai no tava GPS un fiksētajiem punktiem.</div>
  </div>
  <div id="modal" class="modal"><div class="box"><h2>Figūra noslēgta</h2><div class="metrics"><div class="metric"><small>Platība</small><b id="area">0 m²</b></div><div class="metric"><small>Perimetrs</small><b id="per">0 m</b></div></div><input id="name" placeholder="Nosaukums, piem. Pagalms"><div class="row"><button id="cancel" class="secondary">Atpakaļ</button><button id="save" class="primary">Saglabāt</button></div></div></div>
  <div id="toast" class="toast"></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),svg=$('sheet'),NS='http://www.w3.org/2000/svg';
let pos=null,origin=null,pts=[],finished=false,closed=false,manualZoom=1,toastTimer=null;
const margin={top:125,right:70,bottom:285,left:55};
function rad(v){return v*Math.PI/180}function distance(a,b){const R=6371008.8,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng),h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(Math.min(1,h)))}
function local(p){if(!origin)return{x:0,y:0};const R=6371008.8,lat0=rad(origin.lat);return{x:R*rad(p.lng-origin.lng)*Math.cos(lat0),y:R*rad(p.lat-origin.lat)}}
function fmt(m){const c=Math.max(0,Math.round(m*100));return[(c/100).toFixed(2)+' m',Math.floor(c/100)+' m '+c%100+' cm']}
function polygonArea(list){if(list.length<3)return 0;const q=list.map(local);let s=0;for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s)/2}
function perimeter(list){let s=0;for(let i=1;i<list.length;i++)s+=distance(list[i-1],list[i]);if(list.length>2)s+=distance(list.at(-1),list[0]);return s}
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function el(name,attrs={}){const n=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);return n}
function clearSvg(){while(svg.firstChild)svg.removeChild(svg.firstChild)}
function bounds(points){if(!points.length)return{minX:-5,maxX:5,minY:-5,maxY:5};let xs=points.map(p=>p.x),ys=points.map(p=>p.y);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);if(maxX-minX<4){minX-=2;maxX+=2}if(maxY-minY<4){minY-=2;maxY+=2}return{minX,maxX,minY,maxY}}
function view(){const W=svg.clientWidth||window.innerWidth,H=svg.clientHeight||window.innerHeight,availW=Math.max(100,W-margin.left-margin.right),availH=Math.max(100,H-margin.top-margin.bottom);let data=pts.map(local);if(pos&&origin&&!finished&&!closed)data.push(local(pos));let b=bounds(data),spanX=b.maxX-b.minX,spanY=b.maxY-b.minY;let scale=Math.min(availW/(spanX+4),availH/(spanY+4));scale=Math.min(95,Math.max(6,scale))*manualZoom;const cx=(b.minX+b.maxX)/2,cy=(b.minY+b.maxY)/2;return{W,H,scale,cx,cy,toScreen:p=>({x:W/2+(p.x-cx)*scale,y:(margin.top+availH/2)-(p.y-cy)*scale})}}
function drawGrid(v){const meterStep=v.scale>=45?1:v.scale>=20?2:v.scale>=10?5:10;$('scale').textContent='1 rūtiņa = '+meterStep+' m';const left=v.cx-(v.W/2)/v.scale,right=v.cx+(v.W/2)/v.scale,bottom=v.cy-((v.H-margin.top)/2)/v.scale,top=v.cy+((v.H-margin.top)/2)/v.scale;const startX=Math.floor(left/meterStep)*meterStep,endX=Math.ceil(right/meterStep)*meterStep,startY=Math.floor(bottom/meterStep)*meterStep,endY=Math.ceil(top/meterStep)*meterStep;for(let x=startX;x<=endX;x+=meterStep){const a=v.toScreen({x,y:bottom}),b=v.toScreen({x,y:top});svg.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:x===0?'axis-line':'grid-line'}))}for(let y=startY;y<=endY;y+=meterStep){const a=v.toScreen({x:left,y}),b=v.toScreen({x:right,y});svg.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:y===0?'axis-line':'grid-line'}))}}
function textAt(txt,x,y,cls){const t=el('text',{x,y,class:cls,'text-anchor':'middle','dominant-baseline':'central'});t.textContent=txt;svg.appendChild(t);return t}
function draw(){clearSvg();const v=view();drawGrid(v);const q=pts.map(local),s=q.map(v.toScreen);
 if(closed&&s.length>=3){svg.appendChild(el('polygon',{points:s.map(p=>p.x+','+p.y).join(' '),class:'shape-fill'}))}
 for(let i=1;i<s.length;i++){svg.appendChild(el('line',{x1:s[i-1].x,y1:s[i-1].y,x2:s[i].x,y2:s[i].y,class:'fixed-line'}));const m={x:(s[i-1].x+s[i].x)/2,y:(s[i-1].y+s[i].y)/2};textAt(fmt(distance(pts[i-1],pts[i]))[0],m.x,m.y-12,'seg-label')}
 if(closed&&s.length>=3){svg.appendChild(el('line',{x1:s.at(-1).x,y1:s.at(-1).y,x2:s[0].x,y2:s[0].y,class:'fixed-line'}));const m={x:(s.at(-1).x+s[0].x)/2,y:(s.at(-1).y+s[0].y)/2};textAt(fmt(distance(pts.at(-1),pts[0]))[0],m.x,m.y-12,'seg-label');const c={x:s.reduce((a,p)=>a+p.x,0)/s.length,y:s.reduce((a,p)=>a+p.y,0)/s.length};textAt(polygonArea(pts).toFixed(2)+' m²',c.x,c.y,'area-label')}
 if(pos&&origin&&!finished&&!closed&&pts.length){const a=s.at(-1),b=v.toScreen(local(pos));svg.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'live-line'}));const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};textAt(fmt(distance(pts.at(-1),pos))[0],m.x,m.y-12,'seg-label')}
 s.forEach((p,i)=>{svg.appendChild(el('circle',{cx:p.x,cy:p.y,r:8,class:i===0?'start':'point'}));textAt(String(i+1),p.x,p.y+22,'pt-label')});
 if(pos&&origin){const gp=v.toScreen(local(pos)),r=Math.max(8,Math.min(70,(pos.accuracy||0)*v.scale));svg.appendChild(el('circle',{cx:gp.x,cy:gp.y,r,class:'gps-ring'}));svg.appendChild(el('circle',{cx:gp.x,cy:gp.y,r:8,class:'gps-dot'}))}
}
function updateUi(){const active=pts.length>0&&!finished&&!closed;$('main').disabled=!pos;$('main').textContent=!pts.length?'Uzlikt sākuma punktu':active?'Fiksēt punktu':'Jauns mērījums';$('undo').disabled=!pts.length;$('finish').disabled=pts.length<2||finished||closed;$('close').disabled=pts.length<3||closed;if(!pos){$('title').textContent='GPS inicializācija';return}if(!pts.length){$('title').textContent='GPS gatavs';$('sub').textContent='Nostājies pirmajā stūrī un fiksē punktu'}else if(active){$('title').textContent='Mērīšana aktīva';$('sub').textContent='Ej uz nākamo stūri — taisnā līnija seko tev'}else if(closed){$('title').textContent='Figūra noslēgta';$('sub').textContent=polygonArea(pts).toFixed(2)+' m²'}else{$('title').textContent='Līnija pabeigta';$('sub').textContent='Vari sākt jaunu mērījumu'}if(active&&pos){const f=fmt(distance(pts.at(-1),pos));$('live').textContent=f[0];$('livecm').textContent=f[1]}else{$('live').textContent='0.00 m';$('livecm').textContent='0 m 0 cm'}}
function reset(){pts=[];origin=null;finished=closed=false;manualZoom=1;draw();updateUi()}
$('main').addEventListener('click',()=>{if(!pos)return;if(!pts.length||finished||closed){reset();origin={lat:pos.lat,lng:pos.lng};pts=[{lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy}];toast('Sākuma punkts fiksēts')}else{const p={lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy},a=pts.at(-1);if(distance(a,p)<.25)return toast('Pārvietojies tālāk no iepriekšējā punkta');pts.push(p);toast('Punkts '+pts.length+' fiksēts')}draw();updateUi()});
$('undo').addEventListener('click',()=>{if(closed){closed=false;finished=false}else if(finished){finished=false}else if(pts.length>1){pts.pop()}else{return reset()}draw();updateUi()});
$('finish').addEventListener('click',()=>{finished=true;draw();updateUi();toast('Līnija pabeigta')});
$('close').addEventListener('click',()=>{if(pts.length<3)return;finished=closed=true;$('area').textContent=polygonArea(pts).toFixed(2)+' m²';$('per').textContent=perimeter(pts).toFixed(2)+' m';$('modal').classList.add('show');draw();updateUi()});
$('reset').addEventListener('click',()=>{if(pts.length>1&&!confirm('Dzēst pašreizējo uzmērījumu?'))return;reset()});$('cancel').addEventListener('click',()=>{$('modal').classList.remove('show')});$('save').addEventListener('click',()=>{const all=JSON.parse(localStorage.getItem('yard_shapes_v2')||'[]');all.unshift({name:$('name').value.trim()||'Pagalms',date:new Date().toISOString(),area:polygonArea(pts),perimeter:perimeter(pts),points:pts});localStorage.setItem('yard_shapes_v2',JSON.stringify(all));$('modal').classList.remove('show');toast('Figūra saglabāta')});
$('zoomIn').addEventListener('click',()=>{manualZoom=Math.min(4,manualZoom*1.25);draw()});$('zoomOut').addEventListener('click',()=>{manualZoom=Math.max(.35,manualZoom/1.25);draw()});$('fit').addEventListener('click',()=>{manualZoom=1;draw()});
function onPos(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,timestamp:p.timestamp};$('gpsText').textContent='± '+Math.round(pos.accuracy)+' m';$('dot').className='dot '+(pos.accuracy<=5?'good':pos.accuracy>15?'bad':'');draw();updateUi()}
function onErr(e){$('dot').className='dot bad';$('gpsText').textContent=e.code===1?'GPS bloķēts':'GPS kļūda';$('title').textContent='Nav GPS pozīcijas';$('sub').textContent=e.code===1?'Atļauj Location piekļuvi Safari iestatījumos':'Pārvietojies ārā un pārbaudi GPS signālu'}
if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000});else onErr({code:0});
window.addEventListener('resize',draw);draw();
})();
</script>
</body>
</html>
