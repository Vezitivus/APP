<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101317">
<title>YARD GPS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--panel:rgba(16,19,23,.95);--muted:#9aa4b2;--accent:#ff4b2b;--live:#ff9f1c;--gps:#2f80ff;--good:#28cf72;--warn:#ffb020;--bad:#ff4b55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:#d7dadd;color:#fff}button,input{font:inherit}button{border:0}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{display:none}.top{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{pointer-events:auto;background:var(--panel);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:15px;padding:10px 12px;font-size:13px;font-weight:800;box-shadow:0 8px 24px #0004}.brand{letter-spacing:.14em}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:7px}.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.tools{position:absolute;z-index:1000;right:10px;top:calc(env(safe-area-inset-top) + 64px);display:grid;gap:8px}.tool{width:47px;height:47px;border-radius:15px;background:var(--panel);color:#fff;font-size:20px;box-shadow:0 8px 22px #0004}.tool.active{outline:2px solid rgba(255,255,255,.38)}.draw-tools{position:absolute;z-index:1000;left:10px;top:calc(env(safe-area-inset-top) + 64px);display:grid;gap:8px}.draw-actions{display:none;gap:8px}.draw-actions.show{display:flex}.bottom{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:var(--panel);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:23px;padding:14px;box-shadow:0 14px 36px #0008;transition:.2s}.bottom.hidden{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}.panel-toggle{position:absolute;z-index:1100;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);width:54px;height:44px;border-radius:22px;background:var(--panel);color:#fff;font-size:22px;box-shadow:0 8px 24px #0005}.panel-toggle.panel-open{bottom:calc(env(safe-area-inset-bottom) + 225px)}.head{display:flex;justify-content:space-between;gap:10px;margin-bottom:11px}.status b{display:block;font-size:16px}.status small{display:block;color:var(--muted);margin-top:3px;max-width:235px}.live{text-align:right;min-width:110px}.live strong{display:block;font-size:22px}.live small{color:var(--muted)}.row{display:flex;gap:8px}.primary,.secondary,.danger{border-radius:15px;padding:13px 12px;font-weight:850;font-size:15px}.primary{flex:1;background:linear-gradient(135deg,#ff3b30,#ff7a00);color:#fff}.secondary{background:#27303a;color:#fff}.danger{background:#59242b;color:#ffe3e6}.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.actions button:disabled,.row button:disabled{opacity:.32}.hint{font-size:11px;color:#98a2af;margin-top:9px;text-align:center}.measure-text{color:#fff;font-size:16px;font-weight:900;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 6px #000;transform:translate(-50%,-50%)}.measure-text.saved{font-size:11px;font-weight:800}.leaflet-div-icon.measure-icon{background:transparent;border:0}.pt{width:18px;height:18px;border:3px solid #fff;border-radius:50%;background:var(--accent);box-shadow:0 2px 8px #0008}.draw-pt{width:14px;height:14px;border:2px solid #fff;border-radius:50%;background:#ff9f1c;box-shadow:0 2px 7px #0008}.gps{width:20px;height:20px;border:4px solid #fff;border-radius:50%;background:var(--gps);box-shadow:0 0 0 5px #2f80ff55}.modal{display:none;position:absolute;z-index:3000;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(420px,100%);background:#11161c;border:1px solid #ffffff22;border-radius:22px;padding:18px}.box h2{margin:0 0 6px}.metrics{display:flex;gap:10px;margin:14px 0}.metric{flex:1;background:#20262e;border-radius:14px;padding:12px}.metric small{display:block;color:#9aa4b2}.metric b{display:block;font-size:20px;margin-top:4px}.box input[type=text]{width:100%;border:1px solid #ffffff2b;background:#20262e;color:#fff;border-radius:13px;padding:13px;margin-bottom:12px;font-size:16px}.color-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#20262e;border-radius:13px;padding:10px 12px;margin-bottom:12px}.color-row input{width:58px;height:38px;border:0;background:none}.toast{position:absolute;z-index:4000;top:110px;left:50%;transform:translate(-50%,-12px);opacity:0;background:#11161c;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:750;transition:.18s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.saved-popup{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.saved-popup b{display:block;margin-bottom:7px}.saved-popup input{width:100%;height:34px;border:0}.saved-popup button{width:100%;margin-top:7px;padding:8px;border-radius:9px;background:#312f35;color:#fff}
@media print{.top,.tools,.draw-tools,.bottom,.panel-toggle,.toast,.leaflet-control-attribution{display:none!important}html,body,#app,#map{height:100vh!important}}
</style>
</head>
<body>
<div id="app"><div id="map"></div>
<div class="top"><div class="pill brand">YARD GPS</div><div class="pill"><span id="dot" class="dot"></span><span id="gpsText">GPS gaida…</span></div></div>
<div class="draw-tools"><button id="drawLine" class="tool" title="Zīmēt līniju">／</button><button id="drawArea" class="tool" title="Zīmēt laukumu">⬡</button><div id="drawActions" class="draw-actions"><button id="drawOk" class="tool">✓</button><button id="drawCancel" class="tool">×</button></div></div>
<div class="tools"><button id="follow" class="tool active" title="Sekot GPS">◎</button><button id="boundaries" class="tool active" title="Īpašumu robežas">▦</button><button id="edit" class="tool" title="Rediģēt punktus">✎</button></div>
<div id="bottom" class="bottom"><div class="head"><div class="status"><b id="title">GPS inicializācija</b><small id="sub">Atļauj atrašanās vietas piekļuvi</small></div><div class="live"><strong id="live">0.00 m</strong><small id="livecm">0 m 0 cm</small></div></div><div class="row"><button id="main" class="primary" disabled>Uzlikt sākuma punktu</button><button id="undo" class="secondary" disabled>↶</button></div><div class="actions"><button id="finish" class="secondary" disabled>Beigt</button><button id="close" class="secondary" disabled>Noslēgt</button><button id="pdf" class="secondary">PDF</button><button id="reset" class="danger">Dzēst</button></div><div class="hint">／ līnija · ⬡ laukums · ✎ GPS punktu rediģēšana</div></div>
<button id="panelToggle" class="panel-toggle panel-open" title="Paslēpt vadības paneli">⌄</button>
<div id="modal" class="modal"><div class="box"><h2 id="modalTitle">Saglabāt laukumu</h2><div class="metrics"><div class="metric"><small>Platība</small><b id="area">0 m²</b></div><div class="metric"><small>Perimetrs / garums</small><b id="per">0 m</b></div></div><input id="name" type="text" placeholder="Nosaukums"><div class="color-row"><span>Krāsa</span><input id="shapeColor" type="color" value="#ff4b2b"></div><div class="row"><button id="cancel" class="secondary">Atpakaļ</button><button id="save" class="primary">Saglabāt</button></div></div></div><div id="toast" class="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),STORAGE='yard_saved_shapes_v3';
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([56.9496,24.1052],18);
map.createPane('ortho');map.getPane('ortho').style.zIndex=220;map.createPane('cad');map.getPane('cad').style.zIndex=360;map.createPane('saved');map.getPane('saved').style.zIndex=520;map.createPane('measure');map.getPane('measure').style.zIndex=620;
const fallback=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const ortho=L.tileLayer.wms('https://lvmgeoserver.lvm.lv/geoserver/ows',{pane:'ortho',layers:'public:Orto_LKS',format:'image/jpeg',transparent:false,version:'1.1.1',srs:'EPSG:3857',maxZoom:22,attribution:'Ortofoto © LĢIA / LVM GEO'}).addTo(map);
const cad=L.tileLayer.wms('https://lvmgeoserver.lvm.lv/geoserver/ows',{pane:'cad',layers:'publicwfs:Kadastra_karte',format:'image/png',transparent:true,version:'1.1.1',srs:'EPSG:3857',opacity:1,attribution:'Kadastra dati © VZD / LVM GEO'}).addTo(map);
let boundariesOn=true,pos=null,follow=true,programmatic=false,editing=false,pts=[],markers=[],segLines=[],segLabels=[],preview=null,previewLabel=null,polygon=null,gpsMarker=null,accCircle=null,finished=false,closed=false,toastTimer=null;
let drawMode=null,drawPts=[],drawMarkers=[],drawLayer=null,drawLabels=[],pendingSave=null,savedLayers=[];
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function rad(x){return x*Math.PI/180}function dist(a,b){const R=6371008.8,d1=rad(b.lat-a.lat),d2=rad(b.lng-a.lng),h=Math.sin(d1/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(Math.min(1,h)))}
function fmt(m){const c=Math.max(0,Math.round(m*100));return[(c/100).toFixed(2)+' m',Math.floor(c/100)+' m '+c%100+' cm']}function mid(a,b){return[(a.lat+b.lat)/2,(a.lng+b.lng)/2]}
function areaOf(p){if(p.length<3)return 0;const R=6371008.8,ml=rad(p.reduce((s,x)=>s+x.lat,0)/p.length),q=p.map(x=>[R*rad(x.lng)*Math.cos(ml),R*rad(x.lat)]);let s=0;for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2}function lengthOf(p,close=false){let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);if(close&&p.length>2)s+=dist(p.at(-1),p[0]);return s}
function pIcon(cls='pt'){return L.divIcon({className:'',html:'<div class="'+cls+'"></div>',iconSize:[18,18],iconAnchor:[9,9]})}function gpsIcon(){return L.divIcon({className:'',html:'<div class="gps"></div>',iconSize:[20,20],iconAnchor:[10,10]})}function txt(t,kind=''){return L.divIcon({className:'measure-icon',html:'<div class="measure-text '+kind+'">'+t+'</div>',iconSize:[1,1],iconAnchor:[0,0]})}
function clear(arr){arr.forEach(x=>{try{map.removeLayer(x)}catch(e){}});arr.length=0}function clearPreview(){if(preview)map.removeLayer(preview);if(previewLabel)map.removeLayer(previewLabel);preview=previewLabel=null;$('live').textContent='0.00 m';$('livecm').textContent='0 m 0 cm'}
function redraw(){clear(segLines);clear(segLabels);if(polygon){map.removeLayer(polygon);polygon=null}for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];segLines.push(L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{pane:'measure',color:'#ff4b2b',weight:5,lineCap:'round'}).addTo(map));segLabels.push(L.marker(mid(a,b),{pane:'measure',icon:txt(fmt(dist(a,b))[0]),interactive:false}).addTo(map))}if(closed&&pts.length>2){const a=pts.at(-1),b=pts[0];segLines.push(L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{pane:'measure',color:'#ff4b2b',weight:5}).addTo(map));segLabels.push(L.marker(mid(a,b),{pane:'measure',icon:txt(fmt(dist(a,b))[0]),interactive:false}).addTo(map));polygon=L.polygon(pts.map(p=>[p.lat,p.lng]),{pane:'measure',color:'#ff4b2b',weight:2,fillColor:'#ff4b2b',fillOpacity:.09,interactive:false}).addTo(map)}ui()}
function setMarkers(){clear(markers);pts.forEach((p,i)=>{const m=L.marker([p.lat,p.lng],{pane:'measure',icon:pIcon(),draggable:editing,zIndexOffset:1000}).addTo(map);m.on('drag',e=>{const ll=e.target.getLatLng();pts[i]={...pts[i],lat:ll.lat,lng:ll.lng};redraw();updatePreview()});markers.push(m)})}
function updatePreview(){if(!pos||!pts.length||finished||closed){clearPreview();return}const a=pts.at(-1),f=fmt(dist(a,pos));if(!preview)preview=L.polyline([[a.lat,a.lng],[pos.lat,pos.lng]],{pane:'measure',color:'#ff9f1c',weight:4,dashArray:'8 7'}).addTo(map);else preview.setLatLngs([[a.lat,a.lng],[pos.lat,pos.lng]]);if(!previewLabel)previewLabel=L.marker(mid(a,pos),{pane:'measure',icon:txt(f[0]),interactive:false}).addTo(map);else previewLabel.setLatLng(mid(a,pos)).setIcon(txt(f[0]));$('live').textContent=f[0];$('livecm').textContent=f[1]}
function ui(){const active=pts.length&&!finished&&!closed;$('main').disabled=!pos;$('main').textContent=!pts.length?'Uzlikt sākuma punktu':active?'Fiksēt punktu':'Jauns mērījums';$('undo').disabled=!pts.length;$('finish').disabled=pts.length<2||finished||closed;$('close').disabled=pts.length<3||closed;if(!pos){$('title').textContent='GPS inicializācija';return}if(!pts.length){$('title').textContent='GPS gatavs';$('sub').textContent='Nostājies stūrī un fiksē sākuma punktu'}else if(active){$('title').textContent='Mērīšana aktīva';$('sub').textContent='Ej uz nākamo punktu — līnija seko GPS'}else if(closed){$('title').textContent='Figūra noslēgta';$('sub').textContent=areaOf(pts).toFixed(2)+' m²'}else{$('title').textContent='Līnija pabeigta';$('sub').textContent='Vari sākt jaunu mērījumu'}}
function reset(){clearPreview();clear(markers);clear(segLines);clear(segLabels);if(polygon)map.removeLayer(polygon);polygon=null;pts=[];finished=false;closed=false;editing=false;$('edit').classList.remove('active');ui()}
function openSave(shape){pendingSave=shape;$('modalTitle').textContent=shape.type==='area'?'Saglabāt laukumu':'Saglabāt līniju';$('area').textContent=shape.type==='area'?areaOf(shape.points).toFixed(2)+' m²':'—';$('per').textContent=lengthOf(shape.points,shape.type==='area').toFixed(2)+' m';$('name').value='';$('shapeColor').value=shape.color||'#ff4b2b';$('modal').classList.add('show')}
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(e){return[]}}function storeSaved(a){localStorage.setItem(STORAGE,JSON.stringify(a))}
function renderSaved(){clear(savedLayers);const all=loadSaved();all.forEach(s=>{const coords=s.points.map(p=>[p.lat,p.lng]);let layer;if(s.type==='area')layer=L.polygon(coords,{pane:'saved',color:s.color,weight:3,fillColor:s.color,fillOpacity:.22});else layer=L.polyline(coords,{pane:'saved',color:s.color,weight:4});layer.addTo(map);layer.bindPopup('<div class="saved-popup"><b>'+escapeHtml(s.name)+'</b><input type="color" value="'+s.color+'" onchange="YARD_setColor('+s.id+',this.value)"><button onclick="YARD_deleteShape('+s.id+')">Dzēst</button></div>');savedLayers.push(layer);for(let i=1;i<s.points.length;i++){savedLayers.push(L.marker(mid(s.points[i-1],s.points[i]),{pane:'saved',icon:txt(fmt(dist(s.points[i-1],s.points[i]))[0],'saved'),interactive:false}).addTo(map))}if(s.type==='area'&&s.points.length>2){savedLayers.push(L.marker(mid(s.points.at(-1),s.points[0]),{pane:'saved',icon:txt(fmt(dist(s.points.at(-1),s.points[0]))[0],'saved'),interactive:false}).addTo(map))}})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.YARD_setColor=(id,color)=>{const a=loadSaved(),s=a.find(x=>x.id===id);if(s){s.color=color;storeSaved(a);renderSaved()}};window.YARD_deleteShape=id=>{const a=loadSaved().filter(x=>x.id!==id);storeSaved(a);map.closePopup();renderSaved()};
function cancelDraw(){drawMode=null;drawPts=[];clear(drawMarkers);clear(drawLabels);if(drawLayer)map.removeLayer(drawLayer);drawLayer=null;$('drawLine').classList.remove('active');$('drawArea').classList.remove('active');$('drawActions').classList.remove('show');map.dragging.enable()}
function redrawDraw(){clear(drawLabels);if(drawLayer)map.removeLayer(drawLayer);drawLayer=null;if(drawPts.length<1)return;const c=drawPts.map(p=>[p.lat,p.lng]);if(drawMode==='area'&&drawPts.length>=3)drawLayer=L.polygon(c,{pane:'measure',color:'#ff9f1c',weight:3,fillColor:'#ff9f1c',fillOpacity:.12}).addTo(map);else drawLayer=L.polyline(c,{pane:'measure',color:'#ff9f1c',weight:4,dashArray:'7 6'}).addTo(map);for(let i=1;i<drawPts.length;i++)drawLabels.push(L.marker(mid(drawPts[i-1],drawPts[i]),{pane:'measure',icon:txt(fmt(dist(drawPts[i-1],drawPts[i]))[0]),interactive:false}).addTo(map))}
function startDraw(type){cancelDraw();drawMode=type;$('drawLine').classList.toggle('active',type==='line');$('drawArea').classList.toggle('active',type==='area');$('drawActions').classList.add('show');follow=false;$('follow').classList.remove('active');toast(type==='area'?'Pieskaries kartē laukuma stūriem':'Pieskaries kartē līnijas punktiem')}
map.on('click',e=>{if(!drawMode)return;const p={lat:e.latlng.lat,lng:e.latlng.lng};drawPts.push(p);drawMarkers.push(L.marker(e.latlng,{pane:'measure',icon:pIcon('draw-pt'),interactive:false}).addTo(map));redrawDraw()});
$('drawLine').onclick=()=>startDraw('line');$('drawArea').onclick=()=>startDraw('area');$('drawCancel').onclick=cancelDraw;$('drawOk').onclick=()=>{if(drawMode==='line'&&drawPts.length<2)return toast('Vajag vismaz 2 punktus');if(drawMode==='area'&&drawPts.length<3)return toast('Vajag vismaz 3 punktus');const s={type:drawMode,points:drawPts.map(p=>({...p})),color:'#ff4b2b'};cancelDraw();openSave(s)};
$('main').onclick=()=>{if(!pos)return;if(!pts.length||finished||closed){reset();pts=[{lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy}];setMarkers();toast('Sākuma punkts fiksēts')}else{const p={lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy};if(dist(pts.at(-1),p)<.25)return toast('Pārvietojies tālāk');pts.push(p);setMarkers();redraw();toast('Punkts fiksēts')}updatePreview();ui()};
$('finish').onclick=()=>{finished=true;clearPreview();openSave({type:'line',points:pts.map(p=>({...p})),color:'#ff4b2b'})};$('close').onclick=()=>{if(pts.length<3)return;finished=true;closed=true;clearPreview();redraw();openSave({type:'area',points:pts.map(p=>({...p})),color:'#ff4b2b'});ui()};$('undo').onclick=()=>{if(!pts.length)return;if(closed||finished){finished=false;closed=false}pts.pop();setMarkers();redraw();updatePreview()};$('reset').onclick=reset;
$('cancel').onclick=()=>{$('modal').classList.remove('show');pendingSave=null};$('save').onclick=()=>{if(!pendingSave)return;const all=loadSaved();all.push({id:Date.now(),name:$('name').value.trim()|| (pendingSave.type==='area'?'Laukums':'Līnija'),type:pendingSave.type,color:$('shapeColor').value,points:pendingSave.points});storeSaved(all);$('modal').classList.remove('show');pendingSave=null;reset();renderSaved();toast('Saglabāts')};
$('edit').onclick=()=>{editing=!editing;$('edit').classList.toggle('active',editing);setMarkers();toast(editing?'Punktus var pārvietot':'Rediģēšana izslēgta')};$('pdf').onclick=()=>window.print();
$('panelToggle').onclick=()=>{const hidden=$('bottom').classList.toggle('hidden');$('panelToggle').classList.toggle('panel-open',!hidden);$('panelToggle').textContent=hidden?'⌃':'⌄';setTimeout(()=>map.invalidateSize(),220)};
$('follow').onclick=()=>{follow=true;$('follow').classList.add('active');if(pos){programmatic=true;map.setView([pos.lat,pos.lng],Math.max(19,map.getZoom()),{animate:false});setTimeout(()=>programmatic=false,80)}};
$('boundaries').onclick=()=>{boundariesOn=!boundariesOn;$('boundaries').classList.toggle('active',boundariesOn);if(boundariesOn){cad.addTo(map);cad.bringToFront()}else map.removeLayer(cad)};
map.on('dragstart zoomstart',()=>{if(programmatic||drawMode)return;follow=false;$('follow').classList.remove('active')});
function onPos(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('gpsText').textContent='± '+Math.round(pos.accuracy)+' m';$('dot').className='dot '+(pos.accuracy<=5?'good':pos.accuracy>15?'bad':'');const ll=[pos.lat,pos.lng];if(!gpsMarker)gpsMarker=L.marker(ll,{pane:'measure',icon:gpsIcon(),interactive:false,zIndexOffset:1200}).addTo(map);else gpsMarker.setLatLng(ll);if(!accCircle)accCircle=L.circle(ll,{pane:'measure',radius:pos.accuracy,color:'#2f80ff',weight:2,fillColor:'#2f80ff',fillOpacity:.08,interactive:false}).addTo(map);else accCircle.setLatLng(ll).setRadius(pos.accuracy);if(follow){programmatic=true;map.setView(ll,Math.max(19,map.getZoom()),{animate:false});setTimeout(()=>programmatic=false,80)}updatePreview();ui()}
function onErr(e){$('dot').className='dot bad';$('gpsText').textContent=e.code===1?'GPS bloķēts':'GPS kļūda';$('title').textContent='Nav GPS';$('sub').textContent=e.code===1?'Atļauj atrašanās vietu pārlūka iestatījumos':'Pārbaudi GPS signālu'}
renderSaved();if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});else onErr({code:0});setTimeout(()=>map.invalidateSize(),250);ui();
})();
</script></body></html>
