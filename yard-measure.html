<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101317">
<title>YARD GPS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--panel:rgba(16,19,23,.95);--muted:#9aa4b2;--accent:#ff4b2b;--live:#ff9f1c;--gps:#2f80ff;--good:#28cf72;--warn:#ffb020;--bad:#ff4b55;--perp:#00a884;--boundary:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:#101317;color:#fff}button,input{font:inherit}button{border:0}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{display:none}.top{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{pointer-events:auto;background:var(--panel);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:15px;padding:10px 12px;font-size:13px;font-weight:800;box-shadow:0 8px 24px #0004}.brand{letter-spacing:.14em}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:7px}.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.tools{position:absolute;z-index:1000;right:10px;top:calc(env(safe-area-inset-top) + 64px);display:grid;gap:8px}.tool{width:47px;height:47px;border-radius:15px;background:var(--panel);color:#fff;font-size:19px;font-weight:800;box-shadow:0 8px 22px #0004}.tool.active{outline:2px solid rgba(255,255,255,.32)}.bottom{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:var(--panel);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:23px;padding:14px;box-shadow:0 14px 36px #0008}.head{display:flex;justify-content:space-between;gap:10px;margin-bottom:11px}.status b{display:block;font-size:16px}.status small{display:block;color:var(--muted);margin-top:3px;max-width:230px}.live{text-align:right;min-width:110px}.live strong{display:block;font-size:22px}.live small{color:var(--muted)}.row{display:flex;gap:8px}.primary,.secondary,.danger{border-radius:15px;padding:13px 12px;font-weight:850;font-size:14px}.primary{flex:1;background:linear-gradient(135deg,#ff3b30,#ff7a00);color:#fff}.secondary{background:#27303a;color:#fff}.danger{background:#492129;color:#ffd9dc}.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-top:8px}.actions button:disabled,.row button:disabled{opacity:.32}.hint{font-size:11px;color:#98a2af;margin-top:9px;text-align:center}.label{background:#11161c;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:8px;padding:4px 7px;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 3px 10px #0005}.label.perp{background:#073d34;border-color:#59e0c5}.label.boundary{background:#2f235f;border-color:#c4b5fd}.pt{width:18px;height:18px;border:3px solid #fff;border-radius:50%;background:var(--accent);box-shadow:0 2px 8px #0008}.pt.edit{box-shadow:0 0 0 5px rgba(255,75,43,.25),0 2px 8px #0008}.gps{width:20px;height:20px;border:4px solid #fff;border-radius:50%;background:var(--gps);box-shadow:0 0 0 5px #2f80ff55}.modal{display:none;position:absolute;z-index:3000;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(420px,100%);background:#11161c;border:1px solid #ffffff22;border-radius:22px;padding:18px}.box h2{margin:0 0 6px}.metrics{display:flex;gap:10px;margin:14px 0}.metric{flex:1;background:#20262e;border-radius:14px;padding:12px}.metric small{display:block;color:#9aa4b2}.metric b{display:block;font-size:20px;margin-top:4px}.box input{width:100%;border:1px solid #ffffff2b;background:#20262e;color:#fff;border-radius:13px;padding:13px;margin-bottom:12px;font-size:16px}.toast{position:absolute;z-index:4000;top:110px;left:50%;transform:translate(-50%,-12px);opacity:0;background:#11161c;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:750;transition:.18s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media print{.top,.tools,.bottom,.toast,.modal{display:none!important}html,body,#app,#map{height:100vh!important;width:100vw!important}.leaflet-control-attribution{display:block!important}body{background:white!important}}
</style>
</head>
<body>
<div id="app"><div id="map"></div>
<div class="top"><div class="pill brand">YARD GPS</div><div class="pill"><span id="dot" class="dot"></span><span id="gpsText">GPS gaida…</span></div></div>
<div class="tools"><button id="follow" class="tool active" title="Sekot GPS">◎</button><button id="boundaries" class="tool active" title="Īpašumu robežas">▦</button><button id="edit" class="tool" title="Rediģēt punktus">✎</button></div>
<div class="bottom"><div class="head"><div class="status"><b id="title">GPS inicializācija</b><small id="sub">Atļauj atrašanās vietas piekļuvi</small></div><div class="live"><strong id="live">0.00 m</strong><small id="livecm">0 m 0 cm</small></div></div><div class="row"><button id="main" class="primary" disabled>Uzlikt sākuma punktu</button><button id="undo" class="secondary" disabled>↶</button></div><div class="actions"><button id="finish" class="secondary" disabled>Beigt</button><button id="close" class="secondary" disabled>Noslēgt</button><button id="pdf" class="secondary">PDF</button><button id="reset" class="danger">Dzēst</button></div><div class="hint">Ortofoto: LĢIA / LVM GEO · robežas: VZD / LVM GEO · ✎ ļauj pārvietot fiksētos punktus.</div></div>
<div id="modal" class="modal"><div class="box"><h2>Figūra noslēgta</h2><div class="metrics"><div class="metric"><small>Platība</small><b id="area">0 m²</b></div><div class="metric"><small>Perimetrs</small><b id="per">0 m</b></div></div><input id="name" placeholder="Nosaukums, piem. Pagalms"><div class="row"><button id="cancel" class="secondary">Atpakaļ</button><button id="save" class="primary">Saglabāt</button></div></div></div><div id="toast" class="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), WMS='https://lvmgeoserver.lvm.lv/geoserver/ows', WFS='https://lvmgeoserver.lvm.lv/geoserver/publicwfs/wfs';
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([56.95,24.10],18);
const ortho=L.tileLayer.wms(WMS,{layers:'public:Orto_LKS',styles:'',format:'image/vnd.jpeg-png8',transparent:false,version:'1.3.0',crs:L.CRS.EPSG3857,maxZoom:22,attribution:'Ortofoto © LĢIA / LVM GEO'}).addTo(map);
const cadWms=L.tileLayer.wms(WMS,{layers:'publicwfs:Kadastra_karte',styles:'',format:'image/png',transparent:true,version:'1.3.0',crs:L.CRS.EPSG3857,opacity:1,maxZoom:22,attribution:'Kadastra dati © VZD / LVM GEO'}).addTo(map);cadWms.setZIndex(500);
let boundariesOn=true,pos=null,follow=true,programmaticCamera=false,editMode=false,pts=[],markers=[],lines=[],labels=[],preview=null,previewLabel=null,poly=null,gpsMarker=null,accCircle=null,finished=false,closed=false,toastTimer=null,perpLayers=[],boundaryPerpLayers=[],boundarySegments=[],boundaryTypes=null,capPromise=null;
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function rad(x){return x*Math.PI/180}function dist(a,b){const R=6371008.8,d1=rad(b.lat-a.lat),d2=rad(b.lng-a.lng),h=Math.sin(d1/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(Math.min(1,h)))}
function fmt(m){const c=Math.max(0,Math.round(m*100));return[(c/100).toFixed(2)+' m',Math.floor(c/100)+' m '+c%100+' cm']}function mid(a,b){return[(a.lat+b.lat)/2,(a.lng+b.lng)/2]}
function area(p){if(p.length<3)return 0;const R=6371008.8,ml=rad(p.reduce((s,x)=>s+x.lat,0)/p.length),q=p.map(x=>[R*rad(x.lng)*Math.cos(ml),R*rad(x.lat)]);let s=0;for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2}function perimeter(p){let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);if(p.length>2)s+=dist(p.at(-1),p[0]);return s}
function icon(c){return L.divIcon({className:'',html:'<div class="'+c+(editMode?' edit':'')+'"></div>',iconSize:[20,20],iconAnchor:[10,10]})}function lab(t,kind=''){return L.divIcon({className:'',html:'<div class="label '+kind+'">'+t+'</div>',iconAnchor:[35,12]})}
function localRef(p,ref){const R=6371008.8,lat0=rad(ref.lat);return{x:R*rad(p.lng-ref.lng)*Math.cos(lat0),y:R*rad(p.lat-ref.lat)}}function fromLocal(q,ref){const R=6371008.8,lat0=rad(ref.lat);return{lat:ref.lat+(q.y/R)*180/Math.PI,lng:ref.lng+(q.x/(R*Math.cos(lat0)))*180/Math.PI}}
function projectionOnSegment(p,a,b){const P=localRef(p,a),B=localRef(b,a),vx=B.x,vy=B.y,den=vx*vx+vy*vy;if(den<1e-9)return null;const t=(P.x*vx+P.y*vy)/den;if(t<0||t>1)return null;const Q={x:vx*t,y:vy*t},dx=P.x-Q.x,dy=P.y-Q.y;return{point:fromLocal(Q,a),distance:Math.hypot(dx,dy)}}
function clearLayers(a){a.forEach(x=>{try{map.removeLayer(x)}catch(e){}});a.length=0}
function clearGeom(){clearLayers(lines);clearLayers(labels);if(poly){map.removeLayer(poly);poly=null}}
function renderGeometry(){clearGeom();for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];lines.push(L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#ff4b2b',weight:5,lineCap:'round',interactive:false}).addTo(map));labels.push(L.marker(mid(a,b),{icon:lab(fmt(dist(a,b))[0]),interactive:false,zIndexOffset:800}).addTo(map))}if(closed&&pts.length>=3){const a=pts.at(-1),b=pts[0];lines.push(L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#ff4b2b',weight:5,interactive:false}).addTo(map));labels.push(L.marker(mid(a,b),{icon:lab(fmt(dist(a,b))[0]),interactive:false}).addTo(map));poly=L.polygon(pts.map(p=>[p.lat,p.lng]),{color:'#ff4b2b',weight:2,fillColor:'#ff4b2b',fillOpacity:.12,interactive:false}).addTo(map);$('area').textContent=area(pts).toFixed(2)+' m²';$('per').textContent=perimeter(pts).toFixed(2)+' m'}updatePreview();ui()}
function addMarker(p,i){const m=L.marker([p.lat,p.lng],{icon:icon('pt'),draggable:editMode,zIndexOffset:950}).addTo(map);m.on('dragstart',()=>{follow=false;$('follow').classList.remove('active')});m.on('drag',e=>{const ll=e.target.getLatLng();pts[i]={...pts[i],lat:ll.lat,lng:ll.lng};renderGeometry()});m.on('dragend',()=>renderGeometry());markers.push(m)}
function rebuildMarkers(){clearLayers(markers);pts.forEach((p,i)=>addMarker(p,i))}
function updateOwnPerps(){clearLayers(perpLayers);if(!pos||pts.length<3||finished||closed)return;const c=[];for(let i=0;i<pts.length-2;i++){const pr=projectionOnSegment(pos,pts[i],pts[i+1]);if(pr&&pr.distance>.15&&pr.distance<100)c.push(pr)}c.sort((a,b)=>a.distance-b.distance);c.slice(0,2).forEach(pr=>{perpLayers.push(L.polyline([[pos.lat,pos.lng],[pr.point.lat,pr.point.lng]],{color:'#00a884',weight:3,dashArray:'5 6',interactive:false}).addTo(map));perpLayers.push(L.marker(mid(pos,pr.point),{icon:lab('⟂ '+fmt(pr.distance)[0],'perp'),interactive:false}).addTo(map))})}
function extractSegments(geo){const out=[];const add=r=>{for(let i=1;i<r.length;i++)out.push([{lat:r[i-1][1],lng:r[i-1][0]},{lat:r[i][1],lng:r[i][0]}])};for(const f of geo.features||[]){const g=f.geometry;if(!g)continue;if(g.type==='Polygon')g.coordinates.forEach(add);else if(g.type==='MultiPolygon')g.coordinates.forEach(p=>p.forEach(add));else if(g.type==='LineString')add(g.coordinates);else if(g.type==='MultiLineString')g.coordinates.forEach(add)}return out}
async function discoverTypes(){if(boundaryTypes)return boundaryTypes;if(capPromise)return capPromise;capPromise=(async()=>{try{const r=await fetch(WFS+'?service=WFS&version=2.0.0&request=GetCapabilities');if(!r.ok)throw 0;const xml=new DOMParser().parseFromString(await r.text(),'text/xml');const names=[...xml.getElementsByTagNameNS('*','FeatureType')].map(n=>n.getElementsByTagNameNS('*','Name')[0]?.textContent).filter(Boolean);const scored=names.map(n=>({n,s:(/zemes.?vien|land.?parcel|parcel|kadastr/i.test(n)?10:0)+(/robez|boundary/i.test(n)?5:0)})).sort((a,b)=>b.s-a.s);boundaryTypes=scored.filter(x=>x.s>0).map(x=>x.n).slice(0,8);return boundaryTypes}catch(e){boundaryTypes=[];return[]}})();return capPromise}
async function refreshBoundaryVectors(){if(!boundariesOn||map.getZoom()<16)return;const types=await discoverTypes();if(!types.length)return;const b=map.getBounds(),bbox=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast(),'EPSG:4326'].join(',');for(const type of types){try{const q=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:type,outputFormat:'application/json',srsName:'EPSG:4326',bbox,count:'1000'});const r=await fetch(WFS+'?'+q);if(!r.ok)continue;const g=await r.json();const seg=extractSegments(g);if(seg.length){boundarySegments=seg;updateBoundaryPerps();return}}catch(e){}}}
function updateBoundaryPerps(){clearLayers(boundaryPerpLayers);if(!pos||!boundariesOn||!boundarySegments.length)return;const c=[];for(const [a,b] of boundarySegments){const pr=projectionOnSegment(pos,a,b);if(pr&&pr.distance>.05&&pr.distance<120)c.push(pr)}c.sort((a,b)=>a.distance-b.distance);const pick=[];for(const pr of c){if(pick.every(x=>dist(x.point,pr.point)>1.5)){pick.push(pr);if(pick.length===3)break}}pick.forEach(pr=>{boundaryPerpLayers.push(L.polyline([[pos.lat,pos.lng],[pr.point.lat,pr.point.lng]],{color:'#8b5cf6',weight:3,dashArray:'4 5',interactive:false}).addTo(map));boundaryPerpLayers.push(L.marker(mid(pos,pr.point),{icon:lab('⟂ '+fmt(pr.distance)[0],'boundary'),interactive:false}).addTo(map))})}
function clearPreview(){if(preview)map.removeLayer(preview);if(previewLabel)map.removeLayer(previewLabel);preview=previewLabel=null;$('live').textContent='0.00 m';$('livecm').textContent='0 m 0 cm';clearLayers(perpLayers)}
function updatePreview(){if(!pos||!pts.length||finished||closed){clearPreview();updateBoundaryPerps();return}const a=pts.at(-1),d=dist(a,pos),f=fmt(d),c=[[a.lat,a.lng],[pos.lat,pos.lng]];if(!preview)preview=L.polyline(c,{color:'#ff9f1c',weight:5,dashArray:'9 8',interactive:false}).addTo(map);else preview.setLatLngs(c);if(!previewLabel)previewLabel=L.marker(mid(a,pos),{icon:lab(f[0]),interactive:false}).addTo(map);else previewLabel.setLatLng(mid(a,pos)).setIcon(lab(f[0]));$('live').textContent=f[0];$('livecm').textContent=f[1];updateOwnPerps();updateBoundaryPerps()}
function ui(){const active=pts.length>0&&!finished&&!closed;$('main').disabled=!pos;$('main').textContent=!pts.length?'Uzlikt sākuma punktu':active?'Fiksēt punktu':'Jauns mērījums';$('undo').disabled=!pts.length;$('finish').disabled=pts.length<2||finished||closed;$('close').disabled=pts.length<3||closed;if(!pos){$('title').textContent='GPS inicializācija';return}if(!pts.length){$('title').textContent='GPS gatavs';$('sub').textContent='Nostājies stūrī un fiksē sākuma punktu'}else if(editMode){$('title').textContent='Rediģēšana';$('sub').textContent='Velc sarkanos punktus ar pirkstu'}else if(active){$('title').textContent='Mērīšana aktīva';$('sub').textContent='Ej uz nākamo punktu — līnija seko GPS'}else if(closed){$('title').textContent='Figūra noslēgta';$('sub').textContent=area(pts).toFixed(2)+' m²'}else{$('title').textContent='Līnija pabeigta';$('sub').textContent='Vari rediģēt punktus vai sākt no jauna'}}
function reset(){clearPreview();clearLayers(boundaryPerpLayers);clearLayers(markers);clearGeom();pts=[];finished=closed=false;editMode=false;$('edit').classList.remove('active');ui();updateBoundaryPerps()}
$('main').onclick=()=>{if(!pos)return;if(!pts.length||finished||closed){reset();pts=[{lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy}];rebuildMarkers();toast('Sākuma punkts fiksēts')}else{const p={lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy};if(dist(pts.at(-1),p)<.3)return toast('Pārvietojies tālāk');pts.push(p);rebuildMarkers();renderGeometry();toast('Punkts fiksēts')}updatePreview();ui()};
$('finish').onclick=()=>{finished=true;clearPreview();ui()};$('close').onclick=()=>{if(pts.length<3)return;finished=closed=true;clearPreview();renderGeometry();$('modal').classList.add('show');ui()};$('undo').onclick=()=>{if(!pts.length)return;if(closed){closed=false;finished=false}else if(finished)finished=false;else pts.pop();rebuildMarkers();renderGeometry()};$('reset').onclick=reset;$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{$('modal').classList.remove('show');toast('Figūra saglabāta')};
$('edit').onclick=()=>{editMode=!editMode;$('edit').classList.toggle('active',editMode);if(editMode){follow=false;$('follow').classList.remove('active')}rebuildMarkers();ui()};
$('pdf').onclick=()=>{toast('Atveras PDF saglabāšana');setTimeout(()=>window.print(),250)};
$('follow').onclick=()=>{follow=true;$('follow').classList.add('active');if(pos){programmaticCamera=true;map.setView([pos.lat,pos.lng],Math.max(19,map.getZoom()),{animate:false});setTimeout(()=>programmaticCamera=false,200)}};
$('boundaries').onclick=()=>{boundariesOn=!boundariesOn;$('boundaries').classList.toggle('active',boundariesOn);if(boundariesOn){cadWms.addTo(map);cadWms.bringToFront();refreshBoundaryVectors()}else{map.removeLayer(cadWms);boundarySegments=[];clearLayers(boundaryPerpLayers)}};
function stopFollow(){if(programmaticCamera)return;if(follow){follow=false;$('follow').classList.remove('active')}}map.on('dragstart zoomstart',stopFollow);let moveTimer=null;map.on('moveend zoomend',()=>{clearTimeout(moveTimer);moveTimer=setTimeout(refreshBoundaryVectors,400)});
function onPos(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('gpsText').textContent='± '+Math.round(pos.accuracy)+' m';$('dot').className='dot '+(pos.accuracy<=5?'good':pos.accuracy>15?'bad':'');const ll=[pos.lat,pos.lng];if(!gpsMarker)gpsMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="gps"></div>',iconSize:[20,20],iconAnchor:[10,10]}),interactive:false,zIndexOffset:1200}).addTo(map);else gpsMarker.setLatLng(ll);if(!accCircle)accCircle=L.circle(ll,{radius:pos.accuracy,color:'#2f80ff',weight:1,fillColor:'#2f80ff',fillOpacity:.08,interactive:false}).addTo(map);else accCircle.setLatLng(ll).setRadius(pos.accuracy);if(follow){programmaticCamera=true;map.setView(ll,Math.max(map.getZoom(),19),{animate:false});setTimeout(()=>programmaticCamera=false,150)}updatePreview();ui();if(!boundarySegments.length)refreshBoundaryVectors()}
function onErr(e){$('dot').className='dot bad';$('gpsText').textContent=e.code===1?'GPS bloķēts':'GPS kļūda';$('title').textContent='Nav GPS';$('sub').textContent=e.code===1?'Atļauj atrašanās vietu pārlūka iestatījumos':'Pārbaudi GPS signālu'}
if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});else onErr({code:0});setTimeout(()=>map.invalidateSize(),250);discoverTypes();ui();
})();
</script></body></html>
