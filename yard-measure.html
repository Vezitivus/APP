<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101317">
<title>YARD GPS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--panel:rgba(16,19,23,.95);--text:#fff;--muted:#9aa4b2;--accent:#ff4b2b;--live:#ff9f1c;--gps:#2f80ff;--good:#28cf72;--warn:#ffb020;--bad:#ff4b55;--boundary:#7447ff;--perp:#00a884;--parcelperp:#22c7ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:#101317;color:var(--text)}button,input{font:inherit}button{border:0}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{display:none}.top{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{pointer-events:auto;background:var(--panel);border:1px solid #ffffff1f;backdrop-filter:blur(14px);border-radius:15px;padding:10px 12px;font-size:13px;font-weight:800;box-shadow:0 8px 24px #0004}.brand{letter-spacing:.14em}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:7px}.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.tools{position:absolute;z-index:1000;right:10px;top:calc(env(safe-area-inset-top) + 64px);display:grid;gap:8px}.tool{width:47px;height:47px;border-radius:15px;background:var(--panel);color:#fff;font-size:21px;box-shadow:0 8px 22px #0004}.tool.active{outline:2px solid #ffffff52}.boundary-status{position:absolute;z-index:900;left:10px;top:calc(env(safe-area-inset-top) + 66px);max-width:calc(100% - 82px);background:#fffffff2;color:#15191f;border-radius:12px;padding:7px 10px;font-size:11px;font-weight:800;box-shadow:0 5px 18px #0002}.bottom{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:var(--panel);backdrop-filter:blur(16px);border:1px solid #ffffff1f;border-radius:23px;padding:14px;box-shadow:0 14px 36px #0008}.head{display:flex;justify-content:space-between;gap:10px;margin-bottom:11px}.status b{display:block;font-size:16px}.status small{display:block;color:var(--muted);margin-top:3px;max-width:235px}.live{text-align:right;min-width:110px}.live strong{display:block;font-size:22px}.live small{color:var(--muted)}.parcel-live{display:none;margin:0 0 10px;padding:9px 10px;border-radius:12px;background:#12303a;border:1px solid #22c7ff55;font-size:12px}.parcel-live.show{display:block}.parcel-live b{color:#7be0ff}.row{display:flex;gap:8px}.primary,.secondary,.danger{border-radius:15px;padding:13px 12px;font-weight:850;font-size:15px}.primary{flex:1;background:linear-gradient(135deg,#ff3b30,#ff7a00);color:#fff}.secondary{background:#27303a;color:#fff}.danger{background:#492129;color:#ffd9dc}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.actions button:disabled,.row button:disabled{opacity:.32}.hint{font-size:11px;color:#98a2af;margin-top:9px;text-align:center}.label{background:#11161c;color:#fff;border:1px solid #ffffffb3;border-radius:8px;padding:4px 7px;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 3px 10px #0005}.label.perp{background:#073d34;border-color:#59e0c5}.label.parcel{background:#073744;border-color:#7be0ff}.pt{width:17px;height:17px;border:3px solid #fff;border-radius:50%;background:var(--accent);box-shadow:0 2px 8px #0008}.gps{width:20px;height:20px;border:4px solid #fff;border-radius:50%;background:var(--gps);box-shadow:0 0 0 5px #2f80ff55}.modal{display:none;position:absolute;z-index:3000;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(420px,100%);background:#11161c;border:1px solid #ffffff22;border-radius:22px;padding:18px}.box h2{margin:0 0 6px}.metrics{display:flex;gap:10px;margin:14px 0}.metric{flex:1;background:#20262e;border-radius:14px;padding:12px}.metric small{display:block;color:#9aa4b2}.metric b{display:block;font-size:20px;margin-top:4px}.box input{width:100%;border:1px solid #ffffff2b;background:#20262e;color:#fff;border-radius:13px;padding:13px;margin-bottom:12px;font-size:16px}.toast{position:absolute;z-index:4000;top:110px;left:50%;transform:translate(-50%,-12px);opacity:0;background:#11161c;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:750;transition:.18s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><div id="map"></div>
<div class="top"><div class="pill brand">YARD GPS</div><div class="pill"><span id="dot" class="dot"></span><span id="gpsText">GPS gaida…</span></div></div>
<div id="boundaryStatus" class="boundary-status">VZD robežas: gaida GPS…</div>
<div class="tools"><button id="follow" class="tool active" title="Sekot GPS">◎</button><button id="boundaries" class="tool active" title="VZD īpašumu robežas">▦</button></div>
<div class="bottom"><div class="head"><div class="status"><b id="title">GPS inicializācija</b><small id="sub">Atļauj atrašanās vietas piekļuvi</small></div><div class="live"><strong id="live">0.00 m</strong><small id="livecm">0 m 0 cm</small></div></div><div id="parcelLive" class="parcel-live"></div><div class="row"><button id="main" class="primary" disabled>Uzlikt sākuma punktu</button><button id="undo" class="secondary" disabled>↶</button></div><div class="actions"><button id="finish" class="secondary" disabled>Beigt līniju</button><button id="close" class="secondary" disabled>Noslēgt figūru</button><button id="reset" class="danger">Dzēst</button></div><div class="hint">Zilās ⟂ līnijas = dzīvs attālums līdz 3 tuvākajām VZD zemes vienību robežām. Zaļās ⟂ līnijas = attālums līdz tavām iepriekš zīmētajām malām.</div></div>
<div id="modal" class="modal"><div class="box"><h2>Figūra noslēgta</h2><div class="metrics"><div class="metric"><small>Platība</small><b id="area">0 m²</b></div><div class="metric"><small>Perimetrs</small><b id="per">0 m</b></div></div><input id="name" placeholder="Nosaukums, piem. Pagalms"><div class="row"><button id="cancel" class="secondary">Atpakaļ</button><button id="save" class="primary">Saglabāt</button></div></div></div><div id="toast" class="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@6.2.0/dist/shp.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([56.95,24.10],18);let base=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© OpenStreetMap'}).addTo(map),tileErrors=0;base.on('tileerror',()=>{if(++tileErrors===5){map.removeLayer(base);base=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map)}});
const PARCEL_ZIP='https://data.gov.lv/dati/dataset/b28f0eed-73b0-4e44-94e7-b04b11bf0b69/resource/43d722c2-1d87-473f-8d48-75eec38a593d/download/0034000_kk_shp.zip';let pos=null,follow=true,pts=[],markers=[],lines=[],labels=[],preview=null,previewLabel=null,poly=null,gpsMarker=null,accCircle=null,finished=false,closed=false,toastTimer=null,parcelSource=null,parcelFeatures=[],parcelSegments=[],boundariesOn=true,parcelLoadPromise=null,lastParcelCenter=null,parcelPerpLayers=[],drawPerpLayers=[];const parcelLayer=L.geoJSON(null,{style:{color:'#7447ff',weight:2,opacity:.9,fillOpacity:0,interactive:false}}).addTo(map);
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}function rad(x){return x*Math.PI/180}function dist(a,b){const R=6371008.8,d1=rad(b.lat-a.lat),d2=rad(b.lng-a.lng),h=Math.sin(d1/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(Math.min(1,h)))}function fmt(m){const c=Math.max(0,Math.round(m*100));return[(c/100).toFixed(2)+' m',Math.floor(c/100)+' m '+c%100+' cm']}function mid(a,b){return[(a.lat+b.lat)/2,(a.lng+b.lng)/2]}function area(p){if(p.length<3)return 0;const R=6371008.8,ml=rad(p.reduce((s,x)=>s+x.lat,0)/p.length),q=p.map(x=>[R*rad(x.lng)*Math.cos(ml),R*rad(x.lat)]);let s=0;for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2}function perimeter(p){let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);if(p.length>2)s+=dist(p.at(-1),p[0]);return s}function icon(c){return L.divIcon({className:'',html:'<div class="'+c+'"></div>',iconSize:[20,20],iconAnchor:[10,10]})}function lab(t,type=''){return L.divIcon({className:'',html:'<div class="label'+(type?' '+type:'')+'">'+t+'</div>',iconAnchor:[35,12]})}function localRef(p,ref){const R=6371008.8,lat0=rad(ref.lat);return{x:R*rad(p.lng-ref.lng)*Math.cos(lat0),y:R*rad(p.lat-ref.lat)}}function fromLocal(q,ref){const R=6371008.8,lat0=rad(ref.lat);return{lat:ref.lat+(q.y/R)*180/Math.PI,lng:ref.lng+(q.x/(R*Math.cos(lat0)))*180/Math.PI}}function nearestOnSegment(p,a,b,strict=false){const ref=a,P=localRef(p,ref),B=localRef(b,ref),vx=B.x,vy=B.y,den=vx*vx+vy*vy;if(den<1e-9)return null;let t=(P.x*vx+P.y*vy)/den;if(strict&&(t<=.02||t>=.98))return null;t=Math.max(0,Math.min(1,t));const Q={x:vx*t,y:vy*t};return{point:fromLocal(Q,ref),distance:Math.hypot(P.x-Q.x,P.y-Q.y),t}}function clearLayers(arr){arr.forEach(x=>{if(map.hasLayer(x))map.removeLayer(x)});arr.length=0}
function updateDrawPerps(){clearLayers(drawPerpLayers);if(!pos||pts.length<3||finished||closed)return;const c=[];for(let i=0;i<pts.length-2;i++){const p=nearestOnSegment(pos,pts[i],pts[i+1],true);if(p&&p.distance>.15&&p.distance<100)c.push(p)}c.sort((a,b)=>a.distance-b.distance);c.slice(0,2).forEach(p=>{drawPerpLayers.push(L.polyline([[pos.lat,pos.lng],[p.point.lat,p.point.lng]],{color:'#00a884',weight:3,dashArray:'5 6',interactive:false}).addTo(map));drawPerpLayers.push(L.marker(mid(pos,p.point),{icon:lab('⟂ '+fmt(p.distance)[0],'perp'),interactive:false,zIndexOffset:900}).addTo(map))})}
function featureCollections(parsed){if(!parsed)return[];if(parsed.type==='FeatureCollection')return[{name:parsed.fileName||'',fc:parsed}];if(Array.isArray(parsed))return parsed.filter(x=>x&&x.type==='FeatureCollection').map((fc,i)=>({name:fc.fileName||String(i),fc}));if(typeof parsed==='object')return Object.entries(parsed).filter(([,fc])=>fc&&fc.type==='FeatureCollection').map(([name,fc])=>({name,fc}));return[]}function isPolygonFeature(f){return f&&f.geometry&&(f.geometry.type==='Polygon'||f.geometry.type==='MultiPolygon')}function selectParcelCollection(parsed){const all=featureCollections(parsed).map(x=>({...x,count:(x.fc.features||[]).filter(isPolygonFeature).length})).filter(x=>x.count);if(!all.length)return null;const exact=all.find(x=>/kkparcel|parcel|zemes.?vien/i.test(x.name));if(exact)return exact.fc;all.sort((a,b)=>b.count-a.count);return all[0].fc}function geoBbox(f){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;const walk=c=>{if(!Array.isArray(c))return;if(typeof c[0]==='number'){minX=Math.min(minX,c[0]);maxX=Math.max(maxX,c[0]);minY=Math.min(minY,c[1]);maxY=Math.max(maxY,c[1]);return}c.forEach(walk)};walk(f.geometry.coordinates);return{minX,minY,maxX,maxY}}function featureNear(f,p,r=1300){const bb=f.__bb||(f.__bb=geoBbox(f)),dLat=r/111320,dLng=r/(111320*Math.max(.25,Math.cos(rad(p.lat))));return bb.maxY>=p.lat-dLat&&bb.minY<=p.lat+dLat&&bb.maxX>=p.lng-dLng&&bb.minX<=p.lng+dLng}function addRingSegments(ring,out){for(let i=1;i<ring.length;i++)out.push([{lat:ring[i-1][1],lng:ring[i-1][0]},{lat:ring[i][1],lng:ring[i][0]}]);if(ring.length>2){const a=ring[0],b=ring.at(-1);if(a[0]!==b[0]||a[1]!==b[1])out.push([{lat:b[1],lng:b[0]},{lat:a[1],lng:a[0]}])}}
function rebuildParcelView(center){if(!parcelSource||!center||!boundariesOn)return;lastParcelCenter={lat:center.lat,lng:center.lng};parcelFeatures=(parcelSource.features||[]).filter(f=>isPolygonFeature(f)&&featureNear(f,center));parcelLayer.clearLayers();parcelLayer.addData({type:'FeatureCollection',features:parcelFeatures});parcelSegments=[];for(const f of parcelFeatures){const g=f.geometry;if(g.type==='Polygon')g.coordinates.forEach(r=>addRingSegments(r,parcelSegments));else g.coordinates.forEach(poly=>poly.forEach(r=>addRingSegments(r,parcelSegments)))}$('boundaryStatus').textContent='VZD robežas: '+parcelFeatures.length+' zemes vienības';updateParcelPerps()}
async function ensureParcels(){if(parcelSource)return parcelSource;if(parcelLoadPromise)return parcelLoadPromise;parcelLoadPromise=(async()=>{try{$('boundaryStatus').textContent='VZD robežas: lejupielādē Ķekavas datus…';if(typeof shp!=='function')throw new Error('SHP bibliotēka nav ielādēta');const parsed=await shp(PARCEL_ZIP);const fc=selectParcelCollection(parsed);if(!fc)throw new Error('Zemes vienību slānis nav atrasts');parcelSource=fc;$('boundaryStatus').textContent='VZD robežas: dati gatavi';if(pos)rebuildParcelView(pos);return fc}catch(e){console.error(e);$('boundaryStatus').textContent='VZD robežas neielādējās — pieskaries ▦, lai mēģinātu vēlreiz';parcelLoadPromise=null;throw e}})();return parcelLoadPromise}
function updateParcelPerps(){clearLayers(parcelPerpLayers);const box=$('parcelLive');box.classList.remove('show');box.textContent='';if(!boundariesOn||!pos||!parcelSegments.length)return;const candidates=[];for(const [a,b] of parcelSegments){const p=nearestOnSegment(pos,a,b,false);if(p&&p.distance<250)candidates.push(p)}candidates.sort((a,b)=>a.distance-b.distance);const picked=[];for(const c of candidates){if(picked.every(x=>dist(x.point,c.point)>1)){picked.push(c);if(picked.length===3)break}}if(!picked.length)return;picked.forEach((p,i)=>{parcelPerpLayers.push(L.polyline([[pos.lat,pos.lng],[p.point.lat,p.point.lng]],{color:'#22c7ff',weight:i===0?4:3,dashArray:'6 6',opacity:.95,interactive:false}).addTo(map));parcelPerpLayers.push(L.marker(mid(pos,p.point),{icon:lab('⟂ '+fmt(p.distance)[0],'parcel'),interactive:false,zIndexOffset:1000}).addTo(map))});box.innerHTML='<b>Robežas:</b> '+picked.map((p,i)=>(i+1)+'. '+fmt(p.distance)[0]).join(' · ');box.classList.add('show')}
function clearPreview(){if(preview&&map.hasLayer(preview))map.removeLayer(preview);if(previewLabel&&map.hasLayer(previewLabel))map.removeLayer(previewLabel);preview=previewLabel=null;$('live').textContent='0.00 m';$('livecm').textContent='0 m 0 cm';clearLayers(drawPerpLayers)}function updatePreview(){if(!pos||!pts.length||finished||closed){clearPreview();return}const a=pts.at(-1),b=pos,d=dist(a,b),f=fmt(d),c=[[a.lat,a.lng],[b.lat,b.lng]];if(!preview)preview=L.polyline(c,{color:'#ff9f1c',weight:5,dashArray:'9 8',lineCap:'round'}).addTo(map);else preview.setLatLngs(c);if(!previewLabel)previewLabel=L.marker(mid(a,b),{icon:lab(f[0]),interactive:false,zIndexOffset:850}).addTo(map);else previewLabel.setLatLng(mid(a,b)).setIcon(lab(f[0]));$('live').textContent=f[0];$('livecm').textContent=f[1];updateDrawPerps()}function addMarker(p){markers.push(L.marker([p.lat,p.lng],{icon:icon('pt'),interactive:false,zIndexOffset:950}).addTo(map))}function addSeg(a,b){lines.push(L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#ff4b2b',weight:5,lineCap:'round'}).addTo(map));labels.push(L.marker(mid(a,b),{icon:lab(fmt(dist(a,b))[0]),interactive:false,zIndexOffset:800}).addTo(map))}
function ui(){const active=pts.length>0&&!finished&&!closed;$('main').disabled=!pos;$('main').textContent=!pts.length?'Uzlikt sākuma punktu':active?'Fiksēt punktu':'Jauns mērījums';$('undo').disabled=!pts.length;$('finish').disabled=pts.length<2||finished||closed;$('close').disabled=pts.length<3||closed;if(!pos){$('title').textContent='GPS inicializācija';return}if(!pts.length){$('title').textContent='GPS gatavs';$('sub').textContent='Nostājies stūrī un fiksē sākuma punktu'}else if(active){$('title').textContent='Mērīšana aktīva';$('sub').textContent='Ej uz nākamo punktu — līnija seko GPS'}else if(closed){$('title').textContent='Figūra noslēgta';$('sub').textContent=area(pts).toFixed(2)+' m²'}else{$('title').textContent='Līnija pabeigta';$('sub').textContent='Vari sākt jaunu mērījumu'}}function reset(){clearPreview();markers.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));labels.forEach(x=>map.removeLayer(x));if(poly&&map.hasLayer(poly))map.removeLayer(poly);pts=[];markers=[];lines=[];labels=[];poly=null;finished=closed=false;ui()}
$('main').onclick=()=>{if(!pos)return;if(!pts.length||finished||closed){reset();const p={lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy};pts=[p];addMarker(p);toast('Sākuma punkts fiksēts')}else{const p={lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy},a=pts.at(-1);if(dist(a,p)<.3)return toast('Pārvietojies tālāk no iepriekšējā punkta');pts.push(p);addMarker(p);addSeg(a,p);clearPreview();toast('Punkts fiksēts')}updatePreview();ui()};$('finish').onclick=()=>{finished=true;clearPreview();ui()};$('close').onclick=()=>{if(pts.length<3)return;finished=closed=true;clearPreview();addSeg(pts.at(-1),pts[0]);poly=L.polygon(pts.map(p=>[p.lat,p.lng]),{color:'#ff4b2b',weight:3,fillColor:'#ff4b2b',fillOpacity:.12}).addTo(map);$('area').textContent=area(pts).toFixed(2)+' m²';$('per').textContent=perimeter(pts).toFixed(2)+' m';$('modal').classList.add('show');ui()};$('undo').onclick=()=>{if(closed||finished){toast('Sāc jaunu mērījumu vai dzēs pašreizējo');return}if(pts.length===1)return reset();clearPreview();map.removeLayer(markers.pop());pts.pop();if(lines.length){map.removeLayer(lines.pop());map.removeLayer(labels.pop())}updatePreview();ui()};$('reset').onclick=reset;$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{let all=[];try{all=JSON.parse(localStorage.getItem('yard_shapes')||'[]')}catch(e){}all.unshift({name:$('name').value.trim()||'Pagalms',date:new Date().toISOString(),area:area(pts),perimeter:perimeter(pts),points:pts});localStorage.setItem('yard_shapes',JSON.stringify(all));$('modal').classList.remove('show');toast('Figūra saglabāta')};$('follow').onclick=()=>{follow=!follow;$('follow').classList.toggle('active',follow);if(follow&&pos)map.setView([pos.lat,pos.lng],Math.max(19,map.getZoom()))};$('boundaries').onclick=async()=>{boundariesOn=!boundariesOn;$('boundaries').classList.toggle('active',boundariesOn);if(!boundariesOn){if(map.hasLayer(parcelLayer))map.removeLayer(parcelLayer);clearLayers(parcelPerpLayers);$('parcelLive').classList.remove('show');$('boundaryStatus').textContent='VZD robežas: izslēgtas'}else{if(!map.hasLayer(parcelLayer))parcelLayer.addTo(map);try{await ensureParcels();if(pos)rebuildParcelView(pos)}catch(e){boundariesOn=false;$('boundaries').classList.remove('active')}}};
function onPos(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('gpsText').textContent='± '+Math.round(pos.accuracy)+' m';$('dot').className='dot '+(pos.accuracy<=5?'good':pos.accuracy>15?'bad':'');const ll=[pos.lat,pos.lng];if(!gpsMarker)gpsMarker=L.marker(ll,{icon:icon('gps'),interactive:false,zIndexOffset:1200}).addTo(map);else gpsMarker.setLatLng(ll);if(!accCircle)accCircle=L.circle(ll,{radius:pos.accuracy,color:'#2f80ff',weight:1,fillColor:'#2f80ff',fillOpacity:.08,interactive:false}).addTo(map);else accCircle.setLatLng(ll).setRadius(pos.accuracy);if(follow)map.setView(ll,Math.max(map.getZoom(),19),{animate:false});if(boundariesOn){if(parcelSource){if(!lastParcelCenter||dist(lastParcelCenter,pos)>180)rebuildParcelView(pos);else updateParcelPerps()}else ensureParcels().catch(()=>{})}updatePreview();ui()}function onErr(e){$('dot').className='dot bad';$('gpsText').textContent=e.code===1?'GPS bloķēts':'GPS kļūda';$('title').textContent='Nav GPS';$('sub').textContent=e.code===1?'Atļauj atrašanās vietu pārlūka iestatījumos':'Pārbaudi GPS signālu'}map.on('moveend zoomend',()=>{if(parcelSource&&pos&&boundariesOn&&map.getZoom()>=16)rebuildParcelView(pos)});if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});else onErr({code:0});setTimeout(()=>map.invalidateSize(),250);ui();
})();
</script></body></html>
