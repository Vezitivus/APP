<!doctype html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111827"><title>YARD GPS</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#app,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:#111827;color:#fff}#map{position:absolute;inset:0}.top{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.pill{pointer-events:auto;background:rgba(17,24,39,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;box-shadow:0 8px 24px #0005}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:6px}.dot.ok{background:#22c55e}.dot.bad{background:#ef4444}.tools{position:absolute;z-index:1000;right:10px;top:calc(env(safe-area-inset-top) + 64px);display:grid;gap:8px}.tool{width:46px;height:46px;border:0;border-radius:14px;background:rgba(17,24,39,.92);color:#fff;font-size:20px;box-shadow:0 8px 24px #0004}.tool.active{background:#ef4444}.bottom{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:rgba(17,24,39,.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px;box-shadow:0 12px 35px #0007}.row{display:flex;gap:8px}.status{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.status b{display:block;font-size:15px}.status small{color:#aab3c2}.live{text-align:right}.live strong{display:block;font-size:24px}.live small{color:#aab3c2}.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 12px;font-weight:800;font-size:15px}.primary{flex:1;background:#ef4444;color:white}.secondary{background:#303947;color:white}.danger{background:#4b1f25;color:#ffd6d6}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.actions button:disabled{opacity:.35}.cad-note{font-size:11px;color:#cbd5e1;margin-top:9px;display:flex;justify-content:space-between;gap:8px}.label{background:#111827;color:#fff;border:1px solid #fff8;border-radius:8px;padding:4px 7px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px #0005}.leaflet-div-icon{background:transparent;border:0}.pt{width:17px;height:17px;border:3px solid white;border-radius:50%;background:#ef4444;box-shadow:0 2px 8px #0008}.gps{width:20px;height:20px;border:4px solid white;border-radius:50%;background:#2563eb;box-shadow:0 0 0 5px #2563eb44}.modal{display:none;position:absolute;z-index:2000;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(420px,100%);background:#111827;border:1px solid #ffffff24;border-radius:22px;padding:18px}.box h2{margin:0 0 6px}.box input{width:100%;margin:14px 0;padding:13px;border-radius:12px;border:1px solid #ffffff33;background:#202938;color:#fff;font-size:16px}.box .metrics{display:flex;gap:10px}.metric{flex:1;background:#202938;border-radius:12px;padding:12px}.metric small{color:#aab3c2}.metric b{display:block;font-size:20px;margin-top:3px}.toast{position:absolute;z-index:3000;top:100px;left:50%;transform:translate(-50%,-20px);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div id="app"><div id="map"></div><div class="top"><div class="pill">YARD GPS</div><div class="pill"><span id="dot" class="dot"></span><span id="gpsText">GPS gaida…</span></div></div><div class="tools"><button id="follow" class="tool active" title="Sekot GPS">◎</button><button id="cad" class="tool active" title="VZD kadastrs">▦</button></div><div class="bottom"><div class="status"><div><b id="title">GPS inicializācija</b><small id="sub">Atļauj atrašanās vietas piekļuvi</small></div><div class="live"><strong id="live">0.00 m</strong><small id="livecm">0 m 0 cm</small></div></div><div class="row"><button id="main" class="primary" disabled>Uzlikt sākuma punktu</button><button id="undo" class="secondary" disabled>↶</button></div><div class="actions"><button id="finish" class="secondary" disabled>Beigt līniju</button><button id="close" class="secondary" disabled>Noslēgt figūru</button><button id="reset" class="danger">Dzēst</button></div><div class="cad-note"><span>VZD zemes vienību robežas: INSPIRE dati</span><span id="cadStatus">ielādē…</span></div></div><div id="modal" class="modal"><div class="box"><h2>Figūra noslēgta</h2><div class="metrics"><div class="metric"><small>Platība</small><b id="area">0 m²</b></div><div class="metric"><small>Perimetrs</small><b id="per">0 m</b></div></div><input id="name" placeholder="Nosaukums, piem. Pagalms"><div class="row"><button id="cancel" class="secondary">Atpakaļ</button><button id="save" class="primary">Saglabāt</button></div></div></div><div id="toast" class="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([56.95,24.10],18);const base=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let cadLayer=null,cadOn=true,cadTimer=null;const WFS='https://grafws.kadastrs.lv/gateway/gateto/GEOPRODUKTS-WFS-INSPIRE-CP-bd4a685d-2bc3-411a-bc40-1f0eb924cd71';let pos=null,follow=true,pts=[],markers=[],lines=[],labels=[],preview=null,previewLabel=null,poly=null,gpsMarker=null,accCircle=null,finished=false,closed=false,toastTimer;
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}function rad(x){return x*Math.PI/180}function dist(a,b){const R=6371008.8,d1=rad(b.lat-a.lat),d2=rad(b.lng-a.lng),h=Math.sin(d1/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(Math.min(1,h)))}function fmt(m){let c=Math.round(m*100);return[(c/100).toFixed(2)+' m',Math.floor(c/100)+' m '+c%100+' cm']}function mid(a,b){return[(a.lat+b.lat)/2,(a.lng+b.lng)/2]}function area(p){if(p.length<3)return 0;const R=6371008.8,ml=rad(p.reduce((s,x)=>s+x.lat,0)/p.length),q=p.map(x=>[R*rad(x.lng)*Math.cos(ml),R*rad(x.lat)]);let s=0;for(let i=0;i<q.length;i++){let a=q[i],b=q[(i+1)%q.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2}function perimeter(p){let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);if(p.length>2)s+=dist(p[p.length-1],p[0]);return s}function icon(c){return L.divIcon({className:'',html:'<div class="'+c+'"></div>',iconSize:[20,20],iconAnchor:[10,10]})}function lab(t){return L.divIcon({className:'',html:'<div class="label">'+t+'</div>',iconAnchor:[35,12]})}
function clearPreview(){if(preview)map.removeLayer(preview);if(previewLabel)map.removeLayer(previewLabel);preview=previewLabel=null;$('live').textContent='0.00 m';$('livecm').textContent='0 m 0 cm'}function updatePreview(){if(!pos||!pts.length||finished||closed)return clearPreview();let a=pts.at(-1),b=pos,d=dist(a,b),f=fmt(d),c=[[a.lat,a.lng],[b.lat,b.lng]];if(!preview)preview=L.polyline(c,{color:'#f59e0b',weight:5,dashArray:'9 8'}).addTo(map);else preview.setLatLngs(c);if(!previewLabel)previewLabel=L.marker(mid(a,b),{icon:lab(f[0]),interactive:false}).addTo(map);else previewLabel.setLatLng(mid(a,b)).setIcon(lab(f[0]));$('live').textContent=f[0];$('livecm').textContent=f[1]}function addMarker(p){markers.push(L.marker([p.lat,p.lng],{icon:icon('pt'),interactive:false}).addTo(map))}function addSeg(a,b){let d=fmt(dist(a,b))[0];lines.push(L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#ef4444',weight:5}).addTo(map));labels.push(L.marker(mid(a,b),{icon:lab(d),interactive:false}).addTo(map))}
function ui(){let active=pts.length>0&&!finished&&!closed;$('main').disabled=!pos;$('main').textContent=!pts.length?'Uzlikt sākuma punktu':active?'Fiksēt punktu':'Jauns mērījums';$('undo').disabled=!pts.length;$('finish').disabled=pts.length<2||finished||closed;$('close').disabled=pts.length<3||closed;if(!pos){$('title').textContent='GPS inicializācija';return}if(!pts.length){$('title').textContent='GPS gatavs';$('sub').textContent='Nostājies stūrī un fiksē sākuma punktu'}else if(active){$('title').textContent='Mērīšana aktīva';$('sub').textContent='Ej uz nākamo punktu — līnija paliek taisna'}else if(closed){$('title').textContent='Figūra noslēgta';$('sub').textContent=area(pts).toFixed(2)+' m²'}else{$('title').textContent='Līnija pabeigta';$('sub').textContent='Vari sākt jaunu mērījumu'}}function reset(){clearPreview();markers.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));labels.forEach(x=>map.removeLayer(x));if(poly)map.removeLayer(poly);pts=[];markers=[];lines=[];labels=[];poly=null;finished=closed=false;ui()}
$('main').onclick=()=>{if(!pos)return;if(!pts.length||finished||closed){reset();let p={lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy};pts=[p];addMarker(p);toast('Sākuma punkts fiksēts')}else{let p={lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy},a=pts.at(-1);if(dist(a,p)<.3)return toast('Pārvietojies tālāk no iepriekšējā punkta');pts.push(p);addMarker(p);addSeg(a,p);clearPreview();toast('Punkts fiksēts')}updatePreview();ui()};$('finish').onclick=()=>{finished=true;clearPreview();ui()};$('close').onclick=()=>{if(pts.length<3)return;finished=closed=true;clearPreview();addSeg(pts.at(-1),pts[0]);poly=L.polygon(pts.map(p=>[p.lat,p.lng]),{color:'#ef4444',weight:3,fillColor:'#ef4444',fillOpacity:.12}).addTo(map);$('area').textContent=area(pts).toFixed(2)+' m²';$('per').textContent=perimeter(pts).toFixed(2)+' m';$('modal').classList.add('show');ui()};$('undo').onclick=()=>{if(closed||finished){toast('Sāc jaunu mērījumu vai dzēs pašreizējo');return}if(pts.length===1)return reset();clearPreview();map.removeLayer(markers.pop());pts.pop();if(lines.length){map.removeLayer(lines.pop());map.removeLayer(labels.pop())}updatePreview();ui()};$('reset').onclick=()=>reset();$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{let all=JSON.parse(localStorage.getItem('yard_shapes')||'[]');all.unshift({name:$('name').value.trim()||'Pagalms',date:new Date().toISOString(),area:area(pts),perimeter:perimeter(pts),points:pts});localStorage.setItem('yard_shapes',JSON.stringify(all));$('modal').classList.remove('show');toast('Figūra saglabāta')};$('follow').onclick=()=>{follow=!follow;$('follow').classList.toggle('active',follow);if(follow&&pos)map.setView([pos.lat,pos.lng],19)};$('cad').onclick=()=>{cadOn=!cadOn;$('cad').classList.toggle('active',cadOn);if(cadOn)loadCadastre();else if(cadLayer){map.removeLayer(cadLayer);cadLayer=null;$('cadStatus').textContent='izslēgts'}};
async function loadCadastre(){if(!cadOn||map.getZoom()<15){$('cadStatus').textContent='pietuvini karti';return}clearTimeout(cadTimer);cadTimer=setTimeout(async()=>{try{let b=map.getBounds(),bbox=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',');let u=WFS+'?service=WFS&version=2.0.0&request=GetFeature&typeNames=cp:CadastralParcel&srsName=EPSG:4326&bbox='+encodeURIComponent(bbox+',EPSG:4326')+'&outputFormat=application/json&count=500';$('cadStatus').textContent='ielādē…';let r=await fetch(u);if(!r.ok)throw Error(r.status);let j=await r.json();if(cadLayer)map.removeLayer(cadLayer);cadLayer=L.geoJSON(j,{style:{color:'#ffea00',weight:2,fillOpacity:0},interactive:false}).addTo(map);cadLayer.bringToBack();base.bringToBack();$('cadStatus').textContent=(j.features?.length||0)+' robežas'}catch(e){$('cadStatus').textContent='VZD slānis nav pieejams';console.warn('VZD WFS',e)}},350)}map.on('moveend zoomend',loadCadastre);
function gpsOk(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};let ll=[pos.lat,pos.lng];$('gpsText').textContent='± '+Math.round(pos.accuracy)+' m';$('dot').className='dot '+(pos.accuracy<=8?'ok':pos.accuracy>20?'bad':'');if(!gpsMarker)gpsMarker=L.marker(ll,{icon:icon('gps'),interactive:false,zIndexOffset:1000}).addTo(map);else gpsMarker.setLatLng(ll);if(!accCircle)accCircle=L.circle(ll,{radius:pos.accuracy,color:'#2563eb',weight:1,fillOpacity:.06}).addTo(map);else accCircle.setLatLng(ll).setRadius(pos.accuracy);if(follow)map.setView(ll,Math.max(19,map.getZoom()));updatePreview();ui();loadCadastre()}function gpsErr(e){$('dot').className='dot bad';$('gpsText').textContent=e.code===1?'GPS bloķēts':'GPS kļūda';$('title').textContent='Nav GPS piekļuves';$('sub').textContent='Atļauj Location piekļuvi pārlūka iestatījumos'}if(navigator.geolocation)navigator.geolocation.watchPosition(gpsOk,gpsErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});else gpsErr({code:0});setTimeout(()=>map.invalidateSize(),300);ui();
})();</script></body></html>
