name: Deploy Būvju Radars

on:
  push:
    branches: ["riga-build-radar"]
    paths:
      - "riga-build-radar/**"
      - ".github/workflows/riga-build-radar-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riga-build-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './riga-build-radar'
      - id: deployment
        uses: actions/deploy-pages@v4
